            <label class="g-target"><span>סכום יעד</span><input class="field" data-g="target" inputmode="decimal" placeholder="₪" value="${esc(g.target)}"></label>
            <label><span>מתחיל</span><select class="field" data-g="start">${startOpts.map(v => opt(v, g.start)).join("")}</select></label>
            <label><span>מסתיים</span><select class="field" data-g="end"><option value="" ${g.end ? "" : "selected"}>בלי תאריך</option>${endOpts.map(v => opt(v, g.end)).join("")}</select></label>
            <label class="g-monthly"><span>הפרשה בחודש</span><input class="field" data-g="monthly" inputmode="decimal" placeholder="₪" value="${esc(g.monthly)}"></label>
          </div>
          <p class="ob-goal-calc">${n && num(g.target) > 0 ? `${money(num(g.target))} ÷ ${n} חודשים = <b>${money(Math.ceil(num(g.target) / n))}</b> בחודש` : num(g.target) > 0 ? "בלי תאריך סיום: הזינו כמה להפריש בחודש" : ""}</p>
        </div>`; }).join("")}
      </div>
      ${(() => { const have = new Set(ob.goals.map(g => g.name)); const sug = GOAL_SUGGEST.filter(([n]) => !have.has(n) && !(ob.noCar && /רכב/.test(n))); return sug.length ? `<div class="ob-sug"><span>עוד מטרות נפוצות, לחיצה מוסיפה:</span><div class="ob-chips">${sug.map(([n]) => `<button type="button" data-gsug="${esc(n)}">+ ${esc(n)}</button>`).join("")}</div></div>` : ""; })()}
      <div class="ob-add">
        <input class="field" id="obNewGoal" placeholder="שם של מטרה אחרת" aria-label="מטרה חדשה">
        <button type="button" id="obAddGoal">הוספה</button>
      </div>
      <div class="ob-sum" id="obSum"></div>`;
  } else {
    body = `
      <div class="ob-ill">${ill("variable")}</div>
      <div class="ob-kicker">הוצאות משתנות</div>
      <h1>על מה אתם מוציאים במהלך החודש?</h1>
      <p class="lead">לכל סוג הוצאה משתנה קובעים תקציב חודשי. הזינו סכום רק למה שאתם באמת מוציאים עליו, ומחקו את מה שלא שייך לכם.</p>
      ${editListHTML("cats")}`;
  }
  app.innerHTML = `
    <div class="ob">
      <div class="ob-steps" aria-label="שלב ${s+3} מתוך ${STEPS+2}">${Array.from({length:STEPS+2}, (_, i) => `<i class="${i<=s+2?"on":""}"></i>`).join("")}</div>
      ${body}
      <div class="ob-foot">
        <button class="btn btn-ghost" id="obBack">חזרה</button>
        <button class="btn btn-primary" id="obNext">${s<LAST ? (s === 5 || (s === 3 && ob.hasDebts === null) ? "דלג" : "המשך") : (ob.goals.some(g => g.on) ? "סיום ומעבר לדף הבית" : "דילוג וסיום")}</button>
      </div>
    </div>`;

  const od = document.getElementById("obDay"); if(od) od.onchange = () => ob.cycleDay = Number(od.value);
  bindObRestore();
  const obt = document.getElementById("obTour"); if(obt) obt.onclick = () => { intro = { stage:"tour", i:0 }; render(); };
  const ov = document.getElementById("obVar");
  if(ov) ov.onchange = () => { ob.incomeVar = ov.checked; renderOnboarding(); const i = document.getElementById("obIn"); if(i) i.focus(); };
  const inp = document.getElementById("obIn");
  if(inp){
    inp.addEventListener("input", () => { if(s===0) ob.income = inp.value; else ob.saving = inp.value; updateObNote(); });
    inp.addEventListener("keydown", e => { if(e.key === "Enter") next(); });
    setTimeout(() => inp.focus(), 50);
  }
  if(s === 3){
    app.querySelectorAll("[data-yn]").forEach(b => b.onclick = () => {
      ob.hasDebts = b.dataset.yn === "yes";
      if(ob.hasDebts && !ob.debts.length) ob.debts.push({ id:uid(), type:"loan", name:"", bal:"", pay:"", start:"", end:"" });
      renderOnboarding();
    });
    const dw = document.getElementById("obDebts");
    if(dw){
      const onD = e => {
        const row = e.target.closest(".ob-debt"); if(!row) return;
        const d = ob.debts.find(x => x.id === row.dataset.id), f = e.target.dataset.f; if(!f) return;
        if(f === "type" || f === "name" || f === "bal"){ d[f] = e.target.value; if(f === "type" && e.type === "change"){ renderOnboarding(); return; } updateObSum(); return; }
        if(e.type === "change" && !e.target.dataset.part && f !== "track") return;
        const c = loanFormInput(row, d, e, obStartYM()); if(!c) return;
        d.bal = c.bal ? String(c.bal) : ""; d.payCalc = c.pay;
        if(f === "track" && e.type === "change"){ renderOnboarding(); return; }
        updateObSum();
      };
      dw.addEventListener("input", onD); dw.addEventListener("change", onD);
      dw.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { ob.debts = ob.debts.filter(x => x.id !== b.dataset.del); if(!ob.debts.length) ob.hasDebts = null; renderOnboarding(); });
      maybeCoach("ob_debts");
      document.getElementById("obAddDebt").onclick = () => { ob.debts.push({ id:uid(), type:"loan", name:"", bal:"", pay:"", start:"", end:"" }); renderOnboarding(); const ns = app.querySelectorAll("[data-f=name]"); ns[ns.length-1].focus(); };
    }
    updateObSum();
  }
  if(s === 5){
    const gw = document.getElementById("obGoals");
    const onG = e => {
      const row = e.target.closest(".ob-goal"); if(!row) return;
      const g = ob.goals.find(x => x.id === row.dataset.id), f = e.target.dataset.g; if(!f) return;
      if(f === "on"){ g.on = e.target.checked; updateObSum(); return; }
      if(f === "name"){ if(e.type === "change"){ const v = e.target.value.trim(); if(v) g.name = v; ob.renaming = null; renderOnboarding(); } return; }
      if(f === "rename" || f === "del") return;
      g[f] = e.target.value;
      if(f === "start" && g.end && g.end < g.start) g.end = "";
      if(f !== "monthly") obGoalCalc(g);
      if(f === "target" || f === "monthly"){
        g.on = num(g.target) > 0; const cb = row.querySelector("[data-g=on]"); if(cb) cb.checked = g.on;
        if(f === "target"){ const m = row.querySelector("[data-g=monthly]"); if(m) m.value = g.monthly; const n = obGoalMonths(g), t = num(g.target); row.querySelector(".ob-goal-calc").innerHTML = n && t > 0 ? `${money(t)} ÷ ${n} חודשים = <b>${money(Math.ceil(t / n))}</b> בחודש` : t > 0 ? "בלי תאריך סיום: הזינו כמה להפריש בחודש" : ""; }
        updateObSum(); return;
      }
      if(e.type === "change"){ const y = window.scrollY, o = app.querySelector(".ob"), top = o ? o.scrollTop : 0; renderOnboarding(); const o2 = app.querySelector(".ob"); if(o2) o2.scrollTop = top; window.scrollTo(0, y); }
    };
    gw.addEventListener("input", onG); gw.addEventListener("change", onG);
    gw.addEventListener("click", e => {
      const b = e.target.closest("[data-g=rename],[data-g=del]"); if(!b) return;
      const id = b.closest(".ob-goal").dataset.id;
      if(b.dataset.g === "del"){ ob.goals = ob.goals.filter(x => x.id !== id); ob.renaming = null; renderOnboarding(); return; }
      ob.renaming = id; renderOnboarding();
      const f = app.querySelector("[data-g=name]"); if(f){ f.focus(); f.select(); f.addEventListener("keydown", ev => { if(ev.key === "Enter") f.blur(); }); }
    });
    app.querySelectorAll("[data-gsug]").forEach(b => b.onclick = () => {
      const sg = GOAL_SUGGEST.find(([n]) => n === b.dataset.gsug);
      ob.goals.push(obNewGoal(sg[0], sg[1], 12));
      renderOnboarding();
      const t = app.querySelectorAll("[data-g=target]"); t[t.length-1].focus();
    });
    maybeCoach("ob_goals");
    const addG = () => { const f = document.getElementById("obNewGoal"), name = f.value.trim(); if(!name) return; ob.goals.push(obNewGoal(name, 0, 12)); renderOnboarding(); const t = app.querySelectorAll("[data-g=target]"); t[t.length-1].focus(); };
    document.getElementById("obAddGoal").onclick = addG;
    document.getElementById("obNewGoal").addEventListener("keydown", e => { if(e.key === "Enter") addG(); });
    updateObSum();
  }
  if(s === 2 || s === 4){
    const arr = s === 2 ? ob.fixed : ob.cats;
    const wrap = document.getElementById("obList");
    const onRow = e => {
      const row = e.target.closest(".ob-env"); if(!row) return;
      const c = arr.find(x => x.id === row.dataset.id);
      if(e.target.dataset.act === "budget"){
        c.budget = e.target.value;
        { c.on = num(c.budget) > 0; const cb = row.querySelector("[data-act=toggle]"); if(cb) cb.checked = c.on; }
      }
      if(e.target.dataset.act === "toggle") c.on = e.target.checked;
      if(e.target.dataset.act === "name" && e.type === "change"){ const v = e.target.value.trim(); if(v) c.name = v; ob.renaming = null; renderOnboarding(); return; }
      updateObSum();
    };
    wrap.addEventListener("input", onRow);
    wrap.addEventListener("change", onRow);
    {
      wrap.addEventListener("click", e => {
        const b = e.target.closest("[data-act=rename],[data-act=del]"); if(!b) return;
        const id = b.closest(".ob-env").dataset.id;
        if(b.dataset.act === "del"){ const i = arr.findIndex(x => x.id === id); if(i >= 0) arr.splice(i, 1); ob.renaming = null; renderOnboarding(); return; }
        ob.renaming = id; renderOnboarding();
        const f = app.querySelector("[data-act=name]"); if(f){ f.focus(); f.select(); f.addEventListener("keydown", ev => { if(ev.key === "Enter") f.blur(); }); }
      });
      app.querySelectorAll("[data-sug]").forEach(b => b.onclick = () => {
        const item = { id:uid(), name:b.dataset.sug, on:false, budget:"" };
        if(s === 4) item.color = COLORS[arr.length % COLORS.length];
        arr.push(item);
        renderOnboarding();
        const fields = app.querySelectorAll("[data-act=budget]"); fields[fields.length-1].focus();
      });
      maybeCoach(s === 2 ? "ob_fixed" : "ob_cats");
    }
    const addNew = () => {
      const f = document.getElementById("obNew"); const name = f.value.trim();
      if(!name) return;
      const item = { id:uid(), name, on:false, budget:"" };
      if(s === 4) item.color = COLORS[arr.length % COLORS.length];
      arr.push(item);
      renderOnboarding();
      const fields = app.querySelectorAll("[data-act=budget]"); fields[fields.length-1].focus();
    };
    document.getElementById("obAddBtn").onclick = addNew;
    document.getElementById("obNew").addEventListener("keydown", e => { if(e.key === "Enter") addNew(); });
    updateObSum();
  }
  updateObNote();
  const back = document.getElementById("obBack");
  if(back) back.onclick = () => { if(ob.step === 0) ob.pstep = 1; else ob.step--; renderOnboarding(); };
  document.getElementById("obNext").onclick = next;

  function next(){
    const err = document.getElementById("obErr");
    if(s === 0){
      if(num(ob.income) <= 0){ err.textContent = "הזינו סכום גדול מאפס"; return; }
    }
    if(s === 1){
      const sv = num(ob.saving);
      if(sv < 0){ err.textContent = "הסכום לא יכול להיות שלילי"; return; }
      if(sv >= num(ob.income)){ err.textContent = "יעד החיסכון צריך להיות נמוך מההכנסה"; return; }
    }
    if(s === 3 && ob.hasDebts){
      ob.debts = ob.debts.filter(d => d.name.trim() || num(d.bal) > 0 || num(d.amount) > 0);
      let msg = "";
      const bad = ob.debts.find(d => {
        if(d.type === "overdraft"){ if(num(d.bal) <= 0){ msg = "הזינו את יתרת המינוס"; return true; } return false; }
        const c = loanCalc(d, obStartYM());
        if(!(c.A > 0)){ msg = d.type === "installments" ? "הזינו את סכום העסקה" : "הזינו את סכום ההלוואה"; return true; }
        if(!d.start){ msg = d.type === "installments" ? "בחרו את חודש התשלום הראשון" : "בחרו חודש ושנה של תחילת ההלוואה"; return true; }
        if(!c.n){ msg = d.type === "installments" ? "הזינו מספר תשלומים" : "בחרו חודש ושנה של סיום ההלוואה (אחרי ההתחלה)"; return true; }
        if(c.bal <= 0){ msg = `לפי מה שהוזן, "${d.name.trim() || DEBT_TYPES[d.type].t}" כבר שולמה. בדקו את "כבר שילמתי", או מחקו אותה.`; return true; }
        return false;
      });
      if(bad){ renderOnboarding(); document.getElementById("obErr").textContent = msg; return; }
      if(!ob.debts.length) ob.hasDebts = null;
    }
    if(s < LAST){ ob.step++; renderOnboarding(); app.querySelector(".ob").scrollTop = 0; return; }
    finishOnboarding();
  }
}
function obFixedTotal(){ return ob.fixed.filter(c => c.on).reduce((a,c) => a + num(c.budget), 0); }
function updateObNote(){
  const n = document.getElementById("obNote");
  if(n){
    const left = num(ob.income) - num(ob.saving);
    n.innerHTML = num(ob.saving) > 0 && left > 0 ? `נשארים להוצאות <b>${money(left)}</b> בחודש` : "";
  }
}
function obDebtMonthly(d){ return d.type === "overdraft" ? 0 : loanCalc(d, obStartYM()).pay; }
function obDebtPay(){ return ob.hasDebts ? (ob.debts || []).filter(d => d.type !== "overdraft" && loanCalc(d, obStartYM()).bal > 0).reduce((a,d) => a + obDebtMonthly(d), 0) : 0; }
function updateObSum(){
  const el = document.getElementById("obSum"); if(!el) return;
  const afterSaving = num(ob.income) - num(ob.saving);
  const fixed = obFixedTotal() + (ob.step >= 4 ? obDebtPay() : 0);
  if(ob.step === 3){
    const pay = obDebtPay(), rest = afterSaving - obFixedTotal() - pay;
    el.innerHTML = `החזרים חודשיים: <b>${money(pay)}</b>. אחרי החיסכון, הקבועות וההחזרים נשארים <b${rest < 0 ? ' style="color:var(--rose)"' : ""}>${money(rest)}</b> להוצאות משתנות.`;
    return;
  }
  if(ob.step === 5){
    const tot = ob.goals.filter(g => g.on).reduce((a,g) => a + num(g.monthly), 0), sv = num(ob.saving);
    el.innerHTML = tot <= sv
      ? `למטרות <b>${money(tot)}</b> בחודש מתוך יעד חיסכון של <b>${money(sv)}</b>${sv - tot > 0 ? `. ${money(sv - tot)} יישארו חיסכון חופשי` : ""}.`
      : `ההפרשות (<b>${money(tot)}</b>) גבוהות מיעד החיסכון (<b style="color:var(--rose)">${money(sv)}</b>). המטרה הראשונה תתמלא קודם.`;
    return;
  }
  if(ob.step === 2){
    const rest = afterSaving - fixed;
    el.innerHTML = rest >= 0
      ? `סך הכול הוצאות קבועות <b>${money(fixed)}</b>. אחרי החיסכון והקבועות נשארים <b>${money(rest)}</b> להוצאות משתנות.`
      : `סך הכול הוצאות קבועות <b>${money(fixed)}</b>. יחד עם החיסכון זה יותר מההכנסה ב-<b style="color:var(--rose)">${money(-rest)}</b>.`;
    return;
  }
  const avail = afterSaving - fixed;
  const allocated = ob.cats.filter(c => c.on).reduce((a,c) => a + num(c.budget), 0);
  const rest = avail - allocated;
  el.innerHTML = rest >= 0
    ? `נשארו להוצאות משתנות <b>${money(avail)}</b>. חולקו <b>${money(allocated)}</b>${rest > 0 ? `, ועוד <b>${money(rest)}</b> לא חולקו` : ""}.`
    : `חולקו להוצאות משתנות <b>${money(allocated)}</b>, יותר ב-<b style="color:var(--rose)">${money(-rest)}</b> ממה שנשאר אחרי החיסכון וההוצאות הקבועות.`;
}
function finishOnboarding(){
  /* Only categories with a budget go into the app. With none, keep "משתנות נוספות" so expenses have a home. */
  let used = ob.cats.filter(c => c.on && num(c.budget) > 0);
  if(!used.length) used = [ob.cats.find(c => c.name === "משתנות נוספות") || { id:uid(), name:"משתנות נוספות", color:COLORS[0], budget:"" }];
  const cats = used.map(c => ({ id:c.id, name:c.name, color:c.color }));
  const env = {}; used.forEach(c => env[c.id] = num(c.budget));
  const lines = {
    income:[mkLine(({ self:"הכנסה מהעסק", pension:"קצבה" })[(ob.profile || {}).incomeType] || "משכורת", num(ob.income))],
    fixed: ob.fixed.filter(f => f.on && num(f.budget) > 0).map(f => mkLine(f.name, num(f.budget))),
    extra: []
  };
  const ym0 = (() => { const d = new Date(), cd = ob.cycleDay || 1; const t = new Date(d.getFullYear(), d.getMonth() - (d.getDate() < cd ? 1 : 0), 1); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0"); })();
  const debtsList = (ob.hasDebts ? ob.debts : []).filter(d => d.type === "overdraft" ? num(d.bal) > 0 : loanCalc(d, ym0).bal > 0).map(d => {
    const od = d.type === "overdraft", c = od ? null : loanCalc(d, ym0), bal = od ? num(d.bal) : c.bal;
    const name = d.name.trim() || (od ? "מינוס בבנק" : d.type === "installments" ? "תשלומים" : "הלוואה");
    return Object.assign({ id:uid(), type:d.type, name, original:bal, payment: od ? 0 : c.pay, rate: od ? 0 : c.rate, startYM:ym0, paid:{}, history: od ? { [ym0]: bal } : {}, done:false },
      od ? {} : { loan:{ amount:c.A, start:d.start, end: d.type === "installments" ? shiftYM(d.start, c.n - 1) : d.end, months:c.n, track: trackName(d), paidBefore:c.paid } });
  });
  debtsList.filter(d => d.type !== "overdraft").forEach(d => lines.fixed.push(Object.assign(mkLine(d.name, d.payment), { debtId:d.id })));
  const goalsList = ob.goals.filter(g => g.on && g.name.trim() && num(g.target) > 0).map((g, i) => ({ id:uid(), name:g.name.trim(), target:num(g.target), monthly:num(g.monthly), initial:0, date:g.end || null, order:i, startYM: g.start && g.start > ym0 ? g.start : ym0 }));
  state = {
    v:1, onboarded:true, seenVersion:APP_VERSION, incomeVariable: !!ob.incomeVar, profile: ob.profile && ob.profile.first ? Object.assign({}, ob.profile) : null, hideInstall:false, cats, createdAt:Date.now(), lastBackup:null, theme:"auto", cycleDay: ob.cycleDay || 1,
    template:{ income:num(ob.income), saving:num(ob.saving), env, lines },
    months:{}, expenses:[], debts:debtsList, goals:goalsList
  };
  save(); ob = null; ui.tab = "home"; ui.month = curYM();
  render(); toast(state.profile ? `הכול מוכן, ${state.profile.first}` : "הכול מוכן");
}

function applyTheme(){
  const t = state && state.theme;
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
function daysSince(ts){ return Math.floor((Date.now() - ts) / 86400000); }
function backupDue(){ return Object.keys(state.months).length > 0 && daysSince(state.lastBackup || state.createdAt || Date.now()) >= 30; }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function isStandalone(){ return window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches); }

/* ================= DEBTS & GOALS ================= */
const DEBT_TYPES = { loan:{ t:"הלוואה", ic:svgIcon("landmark") }, overdraft:{ t:"מינוס בבנק", ic:svgIcon("trending-down") }, installments:{ t:"עסקה בתשלומים", ic:svgIcon("receipt") } };
function debts(){ return state.debts || (state.debts = []); }
function goals(){ return state.goals || (state.goals = []); }
function debtBalance(d, upto){
  if(d.type === "overdraft"){
    const ks = Object.keys(d.history || {}).filter(k => !upto || k <= upto).sort();
    if(ks.length) return d.history[ks[ks.length - 1]];

        if(!(n > 0) || !(bal > 0)) return;
        const P = loanPayment(bal, rate, n);
        document.getElementById("dPay").value = P;
        const interest = Math.max(0, P * n - bal);
        out.innerHTML = `החזר חודשי: <b>${money(P)}</b>${interest >= 1 ? ` · ריבית כוללת בערך ${money(Math.round(interest))}` : ""}`;
      };
      ["dMonths","dBal","dRate"].forEach(id => { const el = document.getElementById(id); if(el) el.addEventListener("input", () => { if(mIn.value.trim()) recalc(); }); });
    }
    const del = document.getElementById("dDel");
    if(del) armDelete(del, "למחוק?", () => { removeDebtLines(d); state.debts = debts().filter(x => x !== d); save(); closeSheet(); renderApp(); toast("החוב נמחק"); });
    document.getElementById("dSave").onclick = () => {
      const err = document.getElementById("sErr");
      const name = document.getElementById("dName").value.trim() || (od ? "מינוס בבנק" : "");
      const lc = full ? loanCalc(tmp, curYM()) : null;
      const bal = full ? lc.bal : num(document.getElementById("dBal").value);
      const pay = od ? 0 : full ? lc.pay : num((document.getElementById("dPay") || {}).value || 0);
      const rate = full ? lc.rate : t === "loan" ? num((document.getElementById("dRate") || {}).value || 0) : 0;
      if(!name){ err.textContent = "הזינו שם"; return; }
      if(full){
        if(!(lc.A > 0)){ err.textContent = t === "installments" ? "הזינו את סכום העסקה" : "הזינו את סכום ההלוואה"; return; }
        if(!tmp.start){ err.textContent = t === "installments" ? "בחרו את חודש התשלום הראשון" : "בחרו חודש ושנה של תחילת ההלוואה"; return; }
        if(!lc.n){ err.textContent = t === "installments" ? "הזינו מספר תשלומים" : "בחרו חודש ושנה של סיום ההלוואה (אחרי ההתחלה)"; return; }
        if(lc.bal <= 0){ err.textContent = "לפי מה שהוזן, החוב כבר שולם. בדקו את \"כבר שילמתי\"."; return; }
      }
      if(bal < 0){ err.textContent = "היתרה לא יכולה להיות שלילית"; return; }
      if(!od && pay <= 0){ err.textContent = "הזינו החזר חודשי"; return; }
      if(d){
        const B = debtBalance(d);
        d.name = name; d.payment = pay; d.rate = rate;
        const au = document.getElementById("dAuto"); if(au) d.autoPay = au.checked;
        if(od){ d.history = d.history || {}; d.history[curYM()] = bal; }
        else if(Math.abs(bal - B) > 0.5) d.original += (bal - B);
        Object.keys(state.months).filter(k => k >= curYM()).forEach(k => state.months[k].lines.fixed.forEach(l => { if(l.debtId === d.id && l.actual == null){ l.name = name; l.plan = pay; } }));
        d.done = debtBalance(d) <= 0.5;
        save(); closeSheet(); renderApp(); toast("נשמר");
      } else {
        const au = document.getElementById("dAuto");
        const nd = { id:uid(), type:t, name, original:bal, payment:pay, rate, startYM:curYM(), paid:{}, history: od ? { [curYM()]: bal } : {}, done:false, autoPay: au ? au.checked : true };
        if(full) nd.loan = { amount:lc.A, start:tmp.start, end: t === "installments" ? shiftYM(tmp.start, lc.n - 1) : tmp.end, months:lc.n, track: trackName(tmp), paidBefore:lc.paid };
        debts().push(nd);
        if(!od){ const dd = document.getElementById("dDay"); addDebtLine(nd, dd && dd.value ? Number(dd.value) : null); }
        save(); closeSheet(); renderApp(); toast(od ? "המינוס נוסף למעקב" : "החוב נוסף, וההחזר נכנס להוצאות הקבועות");
      }
    };
  };
  draw();
}

/* ---------- goals ---------- */
const GOAL_ICONS = [[/חירום|ביטחון/,"life-buoy"],[/רכב|אוטו/,"car"],[/חופש|טיול/,"plane"],[/דירה|בית|משכנתא/,"house"],[/חתונה/,"gem"],[/לימוד/,"graduation-cap"],[/ילד|לידה/,"baby"]];
function goalIcon(n){ for(const [re, ic] of GOAL_ICONS) if(re.test(n || "")) return svgIcon(ic); return svgIcon("target"); }
function goalProgress(){
  const gs = goals().slice().sort((a,b) => (a.order || 0) - (b.order || 0));
  const cur = {}; gs.forEach(g => cur[g.id] = g.initial || 0);
  const ended = Object.keys(state.months).filter(k => k < curYM() || state.months[k].closed).sort();
  const alloc = {}, saved = {};
  ended.forEach(k => {
    const sv = savedValue(k) || 0; saved[k] = sv;
    let avail = sv; alloc[k] = [];
    gs.forEach(g => {
      if(k < g.startYM || avail <= 0) return;
      const give = Math.min(g.monthly || 0, avail, Math.max(0, g.target - cur[g.id]));
      if(give > 0){ cur[g.id] += give; avail -= give; alloc[k].push({ g, amt: give }); }
    });
  });
  return { gs, cur, alloc, saved };
}
function allocText(list, saved){
  if(!list || !list.length) return "";
  const total = list.reduce((a,x) => a + x.amt, 0), free = Math.max(0, saved - total);
  const parts = list.length <= 2 ? list.map(x => `${money(x.amt)} ל${esc(x.g.name)}`).join(", ") : `${money(total)} למטרות`;
  return `מתוכם ${parts}${free > 0 ? `, ו-${money(free)} חיסכון חופשי` : ""}`;
}
function monthsBetween(a, b){ const [y1,m1] = a.split("-").map(Number), [y2,m2] = b.split("-").map(Number); return (y2 - y1) * 12 + (m2 - m1); }
function goalsHTML(){
  const { gs, cur, alloc, saved } = goalProgress();
  const firstGoal = gs.length ? gs.map(g => g.startYM).sort()[0] : null;
  const savedSince = firstGoal ? Object.keys(saved).filter(k => k >= firstGoal).reduce((a,k) => a + saved[k], 0) : 0;
  const allocSince = Object.keys(alloc).reduce((a,k) => a + alloc[k].reduce((b,x) => b + x.amt, 0), 0);
  const freeSince = Math.max(0, savedSince - allocSince);
  const lastK = Object.keys(alloc).filter(k => alloc[k].length).sort().pop();
  if(!gs.length) return `
    <section class="card empty-month">
      <div class="em-ill">${ill("goals")}</div>
      <h2>בשביל מה חוסכים?</h2>
      <p>מגדירים מטרה, סכום יעד והפרשה חודשית. בסוף כל חודש ההפרשה נכנסת לבד מהחיסכון של החודש.</p>
      <button class="btn btn-primary" id="goalEmergency">להתחיל בקרן חירום</button>
      <button class="btn btn-outline" id="addGoal">מטרה אחרת</button>
    </section>`;
  const totalT = gs.reduce((a,g) => a + g.target, 0), totalC = gs.reduce((a,g) => a + Math.min(cur[g.id], g.target), 0);
  const monthlySum = gs.filter(g => cur[g.id] < g.target).reduce((a,g) => a + (g.monthly || 0), 0);
  const goalSaving = (state.months[curYM()] || state.template).saving || 0;
  const row = (g, i) => {
    const c = Math.min(cur[g.id], g.target), done = c >= g.target, left = g.target - c;
    let sub;
    if(done) sub = `<span class="st-ok">הושגה!</span>`;
    else if(g.date){
      const ml = Math.max(1, monthsBetween(curYM(), g.date) + 1), need = Math.ceil(left / ml);
      sub = `יעד ב${ymLabel(g.date)}<span class="sep"></span><span class="${need > (g.monthly || 0) ? "st-warn" : "st-ok"}">צריך ${money(need)} בחודש</span>`;
    } else if(g.monthly > 0) sub = `${money(g.monthly)} בחודש<span class="sep"></span>תגיעו ב${ymLabel(shiftYM(curYM(), Math.ceil(left / g.monthly)))}`;
    else sub = "לא הוגדרה הפרשה חודשית";
    return `
      <button class="crow" data-goal="${g.id}">
        <span class="cico">${goalIcon(g.name)}</span>
        <span class="cmain"><b>${i + 1}. ${esc(g.name)}</b><small>${sub}</small></span>
        <span class="camt"><b>${money(c)}</b><small>מתוך ${money(g.target)}</small></span>
        <span class="cbar"><i style="width:${Math.min(100, c / g.target * 100)}%;background:${done ? "var(--ok)" : "var(--seal)"}"></i></span>
      </button>`;
  };
  return `
    <section class="yr">
      <div class="yr-label">נצבר למטרות${qh("yrgoal", true)}</div>
      <div class="yr-num">${money(totalC)}</div>
      <div class="yr-of">מתוך ${money(totalT)}${allocSince > 0 ? `. ${money(allocSince)} מתוכם הגיעו מהחיסכון החודשי` : ""}</div>
      <div class="bar" aria-hidden="true"><i style="width:${totalT ? totalC / totalT * 100 : 0}%"></i></div>
      <div class="yr-msg">${monthlySum > goalSaving && goalSaving > 0 ? `ההפרשות למטרות (${money(monthlySum)}) גבוהות מיעד החיסכון החודשי (${money(goalSaving)}). המטרות הראשונות יתמלאו קודם.` : `בכל חודש נכנסים למטרות ${money(monthlySum)} מתוך החיסכון, לפי סדר העדיפות.`}</div>
    </section>
    <div class="sec-head"><h2>המטרות שלי${qh("goals")}</h2><button class="link-btn" id="addGoal">${PLUS_SM}מטרה</button></div>
    <div class="list">${gs.map(row).join("")}
      ${savedSince > 0 ? `
      <div class="free-row">
        <span class="cico">${svgIcon("piggy-bank")}</span>
        <span class="cmain"><b>חיסכון חופשי</b><small>נחסך ולא שויך למטרה</small></span>
        <span class="camt"><b>${money(freeSince)}</b><small>מתוך ${money(savedSince)} שנחסכו</small></span>
      </div>` : ""}
    </div>
    ${lastK ? `<div class="flow"><b>מאיפה הגיע הכסף?</b> ב${monthNameOf(lastK)} נחסכו ${money(saved[lastK])}. ${allocText(alloc[lastK], saved[lastK])}.</div>` : `<div class="flow">ההפרשה הראשונה תיכנס בסוף החודש הנוכחי, מתוך החיסכון שלו.</div>`}
`;
}
function openGoalSheet(id, preset){
  const g = id ? goals().find(x => x.id === id) : null;
  const p = preset || {};
  const n = goals().length;
  const startNow = g ? (g.startYM || curYM()) : curYM(), startLocked = !!g && startNow < curYM();
  const savedNow = g ? (goalProgress().cur[g.id] || 0) - (g.initial || 0) : 0;
  showSheet(`
    <h3 id="sheetTitle">${g ? "עריכת מטרה" : "מטרה חדשה"}</h3>

    ${p.hint ? `<p class="hint">${p.hint}</p>` : ""}
    <div class="err" id="sErr" style="margin-top:8px"></div>
    <div class="actions" style="margin-top:8px">
      ${g ? `<button class="btn btn-danger" id="gDel">מחיקה</button>` : `<button class="btn btn-ghost" id="sCancel">ביטול</button>`}
      <button class="btn btn-primary" id="gSave">שמירה</button>
    </div>`);
  /* Monthly amount = what is still missing, spread over the months left until the end month. */
  const gS = document.getElementById("gStart"), gD = document.getElementById("gDate"), gT = document.getElementById("gTarget"), gM = document.getElementById("gMonthly"), gI = document.getElementById("gInit"), gC = document.getElementById("gCalc");
  const startVal = () => gS ? gS.value : startNow;
  const fillEnd = keep => {
    const from = startVal() > curYM() ? startVal() : curYM();
    const opts = Array.from({length:60}, (_, i) => shiftYM(from, i));
    if(keep && keep < from) opts.unshift(keep);
    gD.innerHTML = `<option value="">בלי תאריך</option>` + opts.map(v => `<option value="${v}" ${v === keep ? "selected" : ""}>${ymLabel(v)}</option>`).join("");
  };
  const calc = () => {

    if(m && left > 0){ gM.value = Math.ceil(left / m); gC.innerHTML = `${money(left)} ÷ ${m} חודשים = <b>${money(Math.ceil(left / m))}</b> בחודש. אפשר לשנות ידנית.`; }

  gD.onchange = calc; gT.oninput = calc; gI.oninput = calc;

    save(); closeSheet(); renderApp(); toast(g ? "נשמר" : "המטרה נוספה");
  };
}

function lineMeta(k, l, ym){

    const d = l.actual - (l.plan || 0);
    const base = k === "income" ? "התקבל" : "שולם";
    if(d > 0 && k !== "income") return { cls:"over", text:`${base}, ${money(d)} יותר מהתכנון` };

function summaryData(ym){

    .sort((a,b) => b.diff - a.diff);
  const fixedOver = ["fixed","extra"].flatMap(k => m.lines[k]).filter(l => l.actual != null && l.actual > (l.plan || 0) && (l.plan || 0) > 0);
  const unpaid = ["fixed","extra"].flatMap(k => m.lines[k]).filter(l => l.actual == null && (l.plan || 0) > 0);
  const sugg = [];

    if(x.budget <= 0) return;

    if((state.applied || {})[key]) return;

      sugg.push({ key, id:x.id, kind:"up", to: roundUp50(avg), text:`${x.c.name} חרגה חודשיים ברצף. הממוצע הוא ${money(avg)}. אפשר להעלות את היעד או להחליט לצמצם.` });

    } else if(ks.length >= 2 && avg <= x.budget * 0.8 && x.budget - roundUp50(avg) >= 50){

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
function goalFor(ym){
  if(state.months[ym]) return state.months[ym].saving || 0;
  const prev = Object.keys(state.months).filter(k => k < ym).sort().pop();
  return prev ? (state.months[prev].saving || 0) : (state.template.saving || 0);
}
function firstTracked(){ const ks = Object.keys(state.months).filter(isTracked).sort(); return ks[0] || startYM(); }
function startYM(){ return state.createdAt ? cycleOf(isoOf(new Date(state.createdAt))) : (Object.keys(state.months).sort()[0] || curYM()); }
function isTracked(ym){
  if(ym >= startYM()) return true;
  const m = state.months[ym];
  return !!(m && (m.savedActual != null || (m.lines && m.lines.income.some(l => l.actual != null))));
}
function savedValue(ym){
  const m = state.months[ym]; if(!m) return null;
  if(m.savedActual != null) return m.savedActual;
  const ended = ym < curYM() || m.closed;
  return ended ? calc(ym).autoSaved : null;
}
function saveStatus(ym){
  const cur = curYM(), m = state.months[ym], goal = goalFor(ym);
  const saved = savedValue(ym);
  const ended = ym < cur || (m && m.closed);
  if(saved == null){
    if(ym < firstTracked()) return { key:"out", text:"לא במעקב" };
    if(ym > cur) return { key:"out", text:"עתידי" };
    if(ym === cur && !ended) return { key:"now", text:"החודש הנוכחי" };
    return { key:"pend", text:"טרם הוזן" };
  }
  if(!ended && saved < goal) return { key:"prog", text:`בתהליך, הועברו ${money(saved)} מתוך ${money(goal)}` };
  if(saved >= goal) return { key:"met", text: saved > goal ? `עמידה ביעד, ועוד ${money(saved - goal)} מעבר` : "עמידה ביעד" };
  return { key:"miss", text:`חסרו ${money(goal - saved)}` };
}
const SAVE_DEF = "חיסכון בפועל = כל הכסף שהעברתם לחיסכון בחודש הזה, כולל היעד.";
function saveBreakdown(goal, saved){
  if(saved == null) return "";
  if(saved > goal && goal > 0) return `יעד ${money(goal)} + עודף ${money(saved - goal)} = ${money(saved)}`;
  if(saved < goal) return `${money(saved)} מתוך יעד של ${money(goal)}`;
  return `${money(saved)}, בדיוק היעד`;
}
function saveQuickOptions(ym){
  const r = calc(ym), goal = r.m.saving || 0, extra = Math.max(0, Math.round(r.leftAfterGoal));
  const opts = [];
  if(goal > 0) opts.push({ v: goal, t: "העברתי את היעד", s: money(goal) });
  if(extra > 0) opts.push({ v: goal + extra, t: r.monthEnded ? "היעד + מה שנשאר" : "היעד + מה שנשאר עד עכשיו", s: money(goal + extra) });
  return opts;
}
function quickHTML(ym, attr){
  const o = saveQuickOptions(ym);
  return o.length ? `<div class="qs">${o.map(x => `<button type="button" class="qs-btn" ${attr}="${x.v}"><span>${x.t}</span><b>${x.s}</b></button>`).join("")}</div>` : "";
}

function saveChartHTML(rows, cur){
  const vals = rows.map(r => r.saved != null ? Math.max(0, r.saved) : r.projected != null ? Math.max(0, r.projected) : null);
  if(!rows.some((r, i) => vals[i] != null || (r.tracked && r.goal > 0))) return "";
  const W = 360, H = 150, top = 12, plotH = 108, base = top + plotH, colW = W / 12, barW = colW * 0.56;
  const maxV = Math.max(1, ...rows.map((r, i) => Math.max(r.tracked ? r.goal : 0, vals[i] || 0)));
  const y = v => base - v / maxV * plotH;
  const cols = rows.map((r, i) => {
    const x = W - (r.i + 1) * colW + (colW - barW) / 2, v = vals[i];
    const kind = r.saved == null ? "proj" : r.tracked && r.goal > 0 && r.saved >= r.goal ? "met" : "ok";
    const bar = v > 0 ? `<rect class="sc-bar ${kind}" x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${barW.toFixed(1)}" height="${(base - y(v)).toFixed(1)}" rx="4"/>` : "";
    const goal = r.tracked && r.goal > 0 ? `<line class="sc-goal" x1="${(x - 3).toFixed(1)}" x2="${(x + barW + 3).toFixed(1)}" y1="${y(r.goal).toFixed(1)}" y2="${y(r.goal).toFixed(1)}"/>` : "";
    return `${bar}${goal}<text class="sc-m${r.ym === cur ? " now" : ""}" x="${(x + barW / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${MONTHS[r.i].slice(0, 3)}</text>`;
  }).join("");
  return `
    <section class="card sc" aria-label="חיסכון לפי חודש">
      <div class="card-head"><h2>חיסכון לפי חודש${qh("sc")}</h2></div>
      <svg class="sc-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="עמודות של החיסכון בכל חודש, וקו של היעד">
        <line class="sc-base" x1="0" x2="${W}" y1="${base}" y2="${base}"/>${cols}
      </svg>
      <div class="sc-legend"><span><i class="ok"></i>נחסך</span><span><i class="met"></i>עמד ביעד</span><span><i class="proj"></i>צפוי</span><span><i class="goal"></i>יעד</span></div>
    </section>`;
}
function savingHTML(){
  const y = ui.year, cur = curYM(), first = firstTracked();
  const yms = MONTHS.map((_, i) => y + "-" + pad(i+1));

    const m = state.months[ym], goal = goalFor(ym), tracked = ym >= first;
    const saved = savedValue(ym);
    const projected = (m && ym === cur && saved == null) ? calc(ym).autoSaved : null;
    const auto = !!(m && m.savedActual == null && saved != null);
    if(tracked) annual += goal;
    if(saved != null){ savedTotal += saved; cum += saved; }
    const st = saveStatus(ym);
    if(st.key === "met") met++;
    if(st.key === "met" || st.key === "miss") ended++;
    return { ym, i, goal, saved, cum, st, tracked, projected, auto };
  });
  const left = Math.max(0, annual - savedTotal);
  const monthsLeft = yms.filter(ym => ym >= first && (ym > cur || (ym === cur && !(state.months[ym] && state.months[ym].closed)))).length;
  let msg;
  if(annual <= 0) msg = "עוד לא הוגדר יעד חיסכון. מגדירים אותו בדף הבית.";

    if(monthsLeft > 0 && y >= new Date().getFullYear()) parts.push(`כדי להגיע ליעד השנתי צריך לחסוך בממוצע ${money(Math.ceil(left / monthsLeft))} בחודש עד סוף השנה.`);
    else parts.push(`חסרו ${money(left)} כדי להגיע ליעד השנתי.`);
    msg = parts.join(" ");
  }
  const ratio = annual > 0 ? Math.min(1, savedTotal / annual) : 0;
  const GP = goalProgress();

      <div class="yr-flow">
        <span>נחסכו ב-${y}<b>${money(savedTotal)}</b></span>
        <span class="op">−</span>
        <span>עברו למטרות<b>${money(yearAlloc)}</b></span>
        <span class="op">=</span>
        <span>נשאר בחיסכון<b>${money(Math.max(0, savedTotal - yearAlloc))}</b></span>
      </div>
      <div class="yr-of" style="margin-top:10px">${annual > 0 ? `יעד החיסכון השנתי: ${money(savedTotal)} מתוך ${money(annual)}` : "אין יעד שנתי"}</div>` : `
      <div class="yr-label">נחסכו ב-${y}${qh("yrsave", true)}</div>
      <div class="yr-num">${money(savedTotal)}</div>
      <div class="yr-of">${annual > 0 ? `מתוך יעד שנתי של ${money(annual)}` : "אין יעד שנתי"}</div>`}
      <div class="bar" aria-hidden="true"><i style="width:${ratio*100}%"></i></div>
      <div class="seals">
        ${rows.map(r => `<button class="sl ${r.st.key}${r.ym === cur ? " now" : ""}" data-sv="${r.ym}" aria-label="${MONTHS[r.i]}: ${r.st.text.replace(/<[^>]+>/g,"")}">
          <i>${r.st.key === "met" ? CHECK : r.st.key === "miss" ? "!" : ""}</i><span>${MONTHS[r.i].slice(0,3)}</span></button>`).join("")}
      </div>
      <div class="yr-msg">${msg}</div>
    </section>

    ${saveChartHTML(rows, cur)}

    <div class="sec-head"><h2>חודש אחר חודש${qh("months")}</h2><span>נשאר ליעד ${money(left)}</span></div>
    <div class="list">
      ${rows.filter(r => r.tracked || r.saved != null).map(r => `
        <button class="env" data-sv="${r.ym}">
          <div class="env-row">
            <div class="env-name"><span>${MONTHS[r.i]}</span></div>

function backupFileName(){
  // a Latin-letter name goes into the file name; Hebrew names are left out, since some browsers then drop the whole name
  const p = state && state.profile, raw = p && p.first ? [p.first, p.last].filter(Boolean).join("-") : "";
  const who = raw && /^[A-Za-z0-9 ._-]+$/.test(raw) ? "-" + raw.replace(/[\s.]+/g, "-") : "";
  return "budget-backup" + who + "-" + todayISO() + ".json";
}
async function doBackup(){
  ui.noLockUntil = Date.now() + 120000;
  const data = JSON.stringify(Object.assign({}, state, { exportedAt:new Date().toISOString(), app:"maatafot" }), null, 2);
  const name = backupFileName();
  const blob = new Blob([data], { type:"application/json" });

  try{
    const file = new File([blob], name, { type:"application/json" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"גיבוי ניהול פיננסי" });
      ok = true;
    }

  if(!ok){
    try{
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); ok = true;
    }catch(e){}
  }
  if(ok){ state.lastBackup = Date.now(); save(); renderApp(); toast("הגיבוי נשמר"); }
  else toast("לא ניתן לשמור קובץ בתצוגה הזו");
}
function validBackup(o){
  return o && o.onboarded === true && Array.isArray(o.cats) && o.months && typeof o.months === "object" && o.template;
}
function restoreFrom(file){
  const reader = new FileReader();
  reader.onload = () => {
    let o; try{ o = JSON.parse(reader.result); }catch(e){ o = null; }
    if(!validBackup(o)){ toast("הקובץ הזה אינו גיבוי של האפליקציה"); return; }
    const sheet = showSheet(`
      <h3 id="sheetTitle">שחזור מגיבוי</h3>
      <p class="hint" style="text-align:center;font-size:14px">הגיבוי מ-${o.exportedAt ? dateLabel(o.exportedAt.slice(0,10)) + " " + o.exportedAt.slice(0,4) : "תאריך לא ידוע"}, עם נתונים של ${Object.keys(o.months).length} חודשים ו-${(o.expenses || []).length} הוצאות.<br>הנתונים שבמכשיר עכשיו יוחלפו בנתוני הגיבוי.</p>
      <div class="actions">
        <button class="btn btn-ghost" id="sCancel">ביטול</button>
        <button class="btn btn-primary" id="rsOk">שחזור</button>
      </div>`);
    document.getElementById("rsOk").onclick = () => {
      if(o.exportedAt) o.lastBackup = Date.parse(o.exportedAt) || o.lastBackup;
      delete o.exportedAt; delete o.app;
      if(!Array.isArray(o.expenses)) o.expenses = [];
      delete o.lock;
      state = o; migrate(); save(); closeSheet();
      ui.tab = "home"; ui.month = curYM(); render(); toast("הנתונים שוחזרו");
    };
  };
  reader.readAsText(file);
}

/* ---------- add / edit expense sheet ---------- */
function defaultDate(){
  const cur = curYM();
  if(ui.month === cur) return todayISO();
  if(ui.month < cur) return isoOf(cycleEnd(ui.month));
  return isoOf(cycleStart(ui.month));
}
function nameHistory(){
  const freq = {}, lastCat = {};
  state.expenses.slice().sort((a,b) => a.created - b.created).forEach(e => {
    const n = (e.name || "").trim(); if(!n || n === "סכום שהוזן לפני הפירוט") return;
    freq[n] = (freq[n] || 0) + 1; lastCat[n] = e.catId;
  });
  return { names: Object.keys(freq).sort((a,b) => freq[b] - freq[a]).slice(0, 40), lastCat };
}
function openSheet(expId, presetCat){
  const exp = expId ? state.expenses.find(e => e.id === expId) : null;
  const chipCats = activeCats().slice();
  if(exp && !chipCats.some(c => c.id === exp.catId)) chipCats.push(catById(exp.catId));
  if(!chipCats.length){ toast("אין קטגוריות. מוסיפים קטגוריה בדף ההוצאות"); return; }
  const pick = id => id && chipCats.some(c => c.id === id);
  const sel = { cat: exp ? exp.catId : pick(presetCat) ? presetCat : pick(state.lastCat) ? state.lastCat : chipCats[0].id };
  const hist = nameHistory();
  const sheet = showSheet(`
    <h3 id="sheetTitle">${exp ? "עריכת הוצאה" : "הוצאה חדשה"}</h3>
    <div class="amount"><input id="sAmt" inputmode="decimal" placeholder="0" value="${exp ? exp.amount : ""}" aria-label="סכום"><span>₪</span></div>
    <div class="err" id="sErr"></div>
    <label class="lbl" for="sName">על מה?</label>
    <input class="field" id="sName" list="nameList" autocomplete="off" placeholder="למשל ארוחה בחוץ" value="${exp ? esc(exp.name || "") : ""}">
    <datalist id="nameList">${hist.names.map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist>
    <span class="lbl" id="catLbl">קטגוריה</span>
    <div class="chips" role="radiogroup" aria-labelledby="catLbl">
      ${chipCats.map(c => `<button type="button" class="chip" role="radio" data-c="${c.id}" aria-checked="${c.id===sel.cat}"><span aria-hidden="true">${iconFor(c.name)}</span> ${esc(c.name)}</button>`).join("")}
    </div>
    <label class="lbl" for="sDate">תאריך</label>
    <input class="field" type="date" id="sDate" value="${exp ? exp.date : defaultDate()}">
    <div class="actions">
      ${exp ? `<button class="btn btn-danger" id="sDel">מחיקה</button>` : `<button class="btn btn-ghost" id="sCancel">ביטול</button>`}
      <button class="btn btn-primary" id="sSave">שמירה</button>
    </div>`);
  const amt = document.getElementById("sAmt"), nm = document.getElementById("sName");
  if(!exp) setTimeout(() => amt.focus(), 280);
  const setCat = id => { sel.cat = id; sheet.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-checked", x.dataset.c === sel.cat)); };
  sheet.querySelectorAll(".chip").forEach(ch => ch.onclick = () => setCat(ch.dataset.c));
  nm.addEventListener("change", () => { const c = hist.lastCat[nm.value.trim()]; if(!exp && pick(c)) setCat(c); });
  const del = document.getElementById("sDel");
  if(del) del.onclick = () => {
    const idx = state.expenses.indexOf(exp);
    state.expenses.splice(idx, 1); save(); closeSheet(); renderApp();
    toast(`${exp.name} נמחקה`, () => { state.expenses.splice(idx, 0, exp); save(); renderApp(); toast("המחיקה בוטלה"); });
  };
  const doSave = () => {
    const err = document.getElementById("sErr");
    const a = num(amt.value), name = nm.value.trim(), date = document.getElementById("sDate").value;
    if(a <= 0){ err.textContent = "הזינו סכום גדול מאפס"; amt.focus(); return; }
    if(!name){ err.textContent = "הזינו שם להוצאה"; nm.focus(); return; }
    if(!date){ err.textContent = "בחרו תאריך"; return; }
    const k = cycleOf(date);
    if(!state.months[k]) monthData(k);
    state.lastCat = sel.cat;
    if(exp){
      Object.assign(exp, { amount:a, name, catId:sel.cat, date });
      save(); ui.month = k; closeSheet(); renderApp(); toast("ההוצאה עודכנה");
    } else {
      const e = { id:uid(), amount:a, name, catId:sel.cat, date, created:Date.now() };
      state.expenses.push(e);
      save(); ui.month = k; closeSheet(); renderApp();
      const total = monthExpenses(k).filter(x => x.catId === e.catId).reduce((s,x) => s + x.amount, 0);
      toast(`${name} נשמרה. ב${catById(e.catId).name}: ${fmt(total)} ₪`, () => {
        state.expenses = state.expenses.filter(x => x !== e); save(); renderApp(); toast("ההוספה בוטלה");
      });
    }
  };
  document.getElementById("sSave").onclick = doSave;
  amt.addEventListener("keydown", e => { if(e.key === "Enter") nm.focus(); });
  nm.addEventListener("keydown", e => { if(e.key === "Enter") doSave(); });
}

function showSheet(html){
  const sheet = document.getElementById("sheet");
  if(!sheet.classList.contains("open")) navPush("sheet");
  sheet.classList.remove("set-sheet");
  sheet.innerHTML = '<div class="handle"></div>' + html;
  document.getElementById("backdrop").classList.add("open");
  sheet.classList.add("open");
  const c = sheet.querySelector("#sCancel"); if(c) c.onclick = closeSheet;
  return sheet;
}
