<style>
:root{
  --paper:#F5F7F4; --surface:#FFFFFF; --ink:#1E2A28; --ink-2:#5C6B68; --line:#E3E8E4;
  --kraft:#E9DBBF; --kraft-ink:#7A6440;
  --seal:#2F7D62; --seal-soft:#DCEBE3; --on-seal:#FFFFFF;
  --amber:#A8721A; --amber-soft:#F5EAD3;
  --rose:#B4465A; --rose-soft:#F6E2E5;
  --spent:#46635E; --track:#EBEFEC;
  --shadow:0 1px 2px rgba(30,42,40,.06), 0 8px 24px rgba(30,42,40,.06);
  --font:"Rubik", -apple-system, "SF Hebrew", "Arial Hebrew", Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101614; --surface:#19211F; --ink:#E6EDEA; --ink-2:#9AAAA6; --line:#2A3431;
    --kraft:#3F3626; --kraft-ink:#E3CFA6;
    --seal:#5FB592; --seal-soft:#1F3A30; --on-seal:#0E1A15;
    --amber:#E0A84A; --amber-soft:#3A2E17;
    --rose:#E07A8C; --rose-soft:#3B2026;
    --spent:#8FB0A9; --track:#24302D;
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101614; --surface:#19211F; --ink:#E6EDEA; --ink-2:#9AAAA6; --line:#2A3431;
  --kraft:#3F3626; --kraft-ink:#E3CFA6;
  --seal:#5FB592; --seal-soft:#1F3A30; --on-seal:#0E1A15;
  --amber:#E0A84A; --amber-soft:#3A2E17;
  --rose:#E07A8C; --rose-soft:#3B2026;
  --spent:#8FB0A9; --track:#24302D;
  --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--paper);scroll-padding-top:env(safe-area-inset-top, 0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px;border-radius:8px}
bdi{font-variant-numeric:tabular-nums}

/* App shell */
.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--paper)}
.top{padding:14px 20px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.2px}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{width:34px;height:34px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center}
.month button:active{background:var(--track)}
.month span{min-width:96px;text-align:center;font-weight:500;font-size:15px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 28px}

/* Envelope hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-top:6px}
.flap{height:78px;background:var(--kraft);clip-path:polygon(0 0,100% 0,100% 34%,50% 100%,0 34%)}
.seal{position:absolute;top:42px;left:50%;transform:translateX(-50%);width:78px;height:78px;border-radius:50%;
  background:var(--seal);color:var(--on-seal);display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 0 5px var(--surface);text-align:center;line-height:1.15}
.seal small{font-size:11px;opacity:.9}
.seal b{font-size:15px;font-weight:600}
.hero-body{padding:50px 20px 20px;text-align:center}
.hero-label{color:var(--ink-2);font-size:15px}
.hero-num{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1.1;margin:4px 0 6px}
.hero-num.over{color:var(--rose)}
.hero-sub{font-size:14px;color:var(--ink-2);max-width:30ch;margin:0 auto}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--track);margin:20px 0 12px;gap:2px}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:right}
.legend div{font-size:12px;color:var(--ink-2)}
.legend b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;vertical-align:1px}

/* Sections */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 10px}
.sec-head h2{font-size:18px;margin:0;font-weight:600}
.sec-head span{font-size:13px;color:var(--ink-2)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.env{width:100%;display:block;text-align:right;background:none;border:0;padding:14px 16px;border-bottom:1px solid var(--line)}
.env:last-child{border-bottom:0}
.env:active{background:var(--track)}
.env-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.env-name{font-weight:500;display:flex;align-items:center;min-width:0}
.env-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env-status{font-size:13px;font-weight:500;white-space:nowrap;padding:2px 9px;border-radius:99px;background:var(--seal-soft);color:var(--seal)}
.env-status.warn{background:var(--amber-soft);color:var(--amber)}
.env-status.over{background:var(--rose-soft);color:var(--rose)}
.env-status.none{background:var(--track);color:var(--ink-2)}
.bar{height:6px;border-radius:99px;background:var(--track);margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--seal);transition:width .4s ease}
.bar i.warn{background:var(--amber)} .bar i.over{background:var(--rose)}
.env-meta{font-size:12px;color:var(--ink-2)}
.exp{width:100%;display:flex;align-items:center;gap:12px;text-align:right;background:none;border:0;padding:12px 16px;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}
.exp:active{background:var(--track)}
.exp-ic{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:600;font-size:15px}
.exp-main{flex:1;min-width:0}
.exp-main b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-main small{color:var(--ink-2);font-size:12px}
.exp-amt{font-weight:600;white-space:nowrap}
.empty{padding:22px 18px;text-align:center;color:var(--ink-2);font-size:14px}
.more{display:block;width:100%;border:0;background:none;padding:12px;color:var(--seal);font-weight:500;border-top:1px solid var(--line)}

/* Install banner */
.install{margin:8px 0 4px;background:var(--seal-soft);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.install p{margin:0;flex:1}
.install button{border:0;background:none;color:var(--ink-2);padding:2px 6px;font-size:18px;line-height:1}

/* Tab bar */
.tabs{display:flex;align-items:flex-end;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 6px max(8px, env(safe-area-inset-bottom, 0px))}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--ink-2)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--seal);font-weight:500}
.fab-wrap{flex:1;display:flex;justify-content:center}
.fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--seal);color:var(--on-seal);display:grid;place-items:center;
  margin-top:-26px;box-shadow:0 0 0 5px var(--surface),0 6px 16px rgba(47,125,98,.35)}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.95)}

/* Budget screen */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.sum h2{font-size:18px;margin:0 0 10px;font-weight:600}
.sum table{width:100%;border-collapse:collapse;font-size:14px}
.sum th{font-weight:500;color:var(--ink-2);font-size:12px;text-align:left;padding:0 0 6px}
.sum th:first-child{text-align:right}
.sum td{padding:7px 0;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
.sum td:first-child{text-align:right;color:var(--ink-2);white-space:normal}
.sum tr.total td{font-weight:600;color:var(--ink);font-size:15px}
.sum td.est{color:var(--ink-2)}
.sum .hint{margin:8px 0 0}
.verdict{margin-top:12px;border-radius:14px;padding:11px 13px;font-size:14px;background:var(--seal-soft);color:var(--seal)}
.verdict.over{background:var(--rose-soft);color:var(--rose)}
.verdict b{font-weight:600}
.saverow{margin-top:12px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:right}
.saverow small{display:block;color:var(--ink-2);font-size:12px}
.saverow .pill{background:var(--seal);color:var(--on-seal);border-radius:99px;padding:5px 12px;font-weight:600;white-space:nowrap}
.copyprev{margin-top:10px;width:100%;border:1px dashed var(--line);background:none;border-radius:14px;padding:11px;color:var(--ink-2);font-size:14px}
.line-nums{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px;font-size:12px;color:var(--ink-2)}
.line-nums b{font-weight:600;color:var(--ink);font-size:14px;margin-right:4px}
.addline{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-top:1px solid var(--line);background:none;
  padding:13px;color:var(--seal);font-weight:500;font-size:15px}
.addline svg{width:18px;height:18px}
.sec-sub{font-size:13px;color:var(--ink-2);margin:-6px 4px 10px}
.hint{font-size:12px;color:var(--ink-2);margin-top:6px}

/* Savings screen */
.yr{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 18px 18px;box-shadow:var(--shadow);text-align:center}
.yr-label{color:var(--ink-2);font-size:15px}
.yr-num{font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1.15;margin:2px 0}
.yr-of{font-size:14px;color:var(--ink-2)}
.seals{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 6px;margin:20px 0 6px}
.sl{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);background:none;border:0;padding:0}
.sl i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:transparent;color:var(--on-seal)}
.sl i svg{width:16px;height:16px}
.sl.met i{background:var(--seal);border-color:var(--seal)}
.sl.miss i{border-color:var(--rose);background:var(--rose-soft);color:var(--rose)}
.sl.pend i{border-style:dashed;border-color:var(--amber)}
.sl.prog i{border-color:var(--seal);background:var(--seal-soft)}
.sl.out i{opacity:.45}
.sl.now span{color:var(--ink);font-weight:600}
.yr .bar{height:8px;margin:16px 0 10px}
.yr-msg{font-size:14px;color:var(--ink);background:var(--paper);border-radius:14px;padding:11px 13px;text-align:right}
.nudge{width:100%;margin:8px 0 2px;display:flex;align-items:center;gap:12px;background:var(--amber-soft);color:var(--ink);border:0;border-radius:16px;padding:13px 14px;text-align:right;font-size:14px}
.nudge b{display:block;font-size:15px}
.nudge .go{margin-right:auto;color:var(--amber);font-weight:600;white-space:nowrap}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:14px}
.switch input{width:22px;height:22px;accent-color:var(--seal)}
.info{margin-top:12px;font-size:13px;color:var(--ink-2);background:var(--paper);border-radius:12px;padding:10px 12px}

/* Home chart + expenses tabs */
.legend-mini{display:flex;justify-content:center;gap:16px;font-size:13px;color:var(--ink-2)}
.chart{margin-top:14px}
.chart h2{font-size:18px;margin:0 0 12px;font-weight:600}
.chart-row{display:flex;flex-direction:column;align-items:center;gap:14px}
.donut{width:160px;height:160px;flex:none}
.donut-num{font:700 14px var(--font);fill:var(--ink)}
.donut-lbl{font:400 10px var(--font);fill:var(--ink-2)}
.chart-legend{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:0}
.chart-legend li{display:flex;align-items:center;gap:8px;font-size:15px;padding:8px 2px;border-top:1px solid var(--line)}
.chart-legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-legend b{font-weight:600;white-space:nowrap}
.chart-legend .dot{margin-left:0;flex:none}
.chart-legend li.lg-head{border-top:0;padding:14px 2px 4px;font-size:13px;color:var(--ink-2)}
.chart-legend li.lg-head b{font-size:13px;color:var(--ink-2);font-weight:600}
.chart-legend li.lg-head:first-child{padding-top:0}
.sum{margin-top:14px}
.pill-soft{background:var(--seal-soft) !important;color:var(--seal) !important}
.seg-top{margin:6px 0 14px}
.tab-total{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin:0 4px 8px;font-size:14px;color:var(--ink-2)}
.tab-total b{font-size:22px;color:var(--ink);font-weight:700}
.catrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.catrow:last-of-type{border-bottom:1px solid var(--line)}
.catrow .env{flex:1;border-bottom:0;min-width:0}
.catrow .edit{width:46px;flex:none;border:0;border-right:1px solid var(--line);background:none;color:var(--ink-2);display:grid;place-items:center}
.catrow .edit:active{background:var(--track)}
.catrow .quick{width:64px;flex:none;border:0;border-right:1px solid var(--line);background:none;color:var(--seal);font-weight:600;font-size:14px}
.catrow .quick:active{background:var(--seal-soft)}
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:9px 16px 7px;background:var(--paper);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.day-head b{font-weight:600;color:var(--ink);font-size:14px}
.list > .day-head:not(:first-child){border-top:1px solid var(--line)}
.cat-sum{display:flex;align-items:center;gap:18px;margin-bottom:8px}
.cat-sum div span{display:block;font-size:12px;color:var(--ink-2)}
.cat-sum div b{font-size:20px;font-weight:700}
.cat-sum .env-status{margin-right:auto}
#sheetTitle .dot{margin-left:8px}
select.field{appearance:none;-webkit-appearance:none}

.empty-month{text-align:center;padding:28px 20px 18px;margin-top:6px}
.empty-month .em-ic{width:56px;height:56px;border-radius:50%;background:var(--kraft);color:var(--kraft-ink);display:grid;place-items:center;margin:0 auto 12px}
.empty-month .em-ic svg{width:28px;height:28px}
.empty-month h2{font-size:20px;margin:0 0 8px}
.empty-month p{color:var(--ink-2);margin:0 auto 18px;max-width:32ch;font-size:15px}
.empty-month .btn{width:100%;margin-top:10px;font-size:16px}

/* Settings screen */
.set-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.set-card h2{font-size:17px;margin:0 0 4px;font-weight:600}
.set-card p{margin:0;color:var(--ink-2);font-size:14px}
.set-card .btn{width:100%;margin-top:12px;font-size:16px;min-height:50px}
.btn-outline{background:none;border:1.5px solid var(--seal) !important;color:var(--seal)}
.set-title{font-size:26px;font-weight:700;letter-spacing:-.4px;margin:4px 4px 14px}
.set-alert{display:flex;align-items:center;gap:12px;background:var(--amber-soft);color:var(--amber);border-radius:18px;padding:12px 14px;margin-bottom:18px}
.set-alert>span:first-child{font-size:20px}
.set-alert-t{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.35}
.set-alert-t small{display:block;font-weight:400;font-size:13px;color:var(--ink-2);margin-top:2px}
.set-alert .btn{min-height:40px;padding:0 16px;font-size:15px;flex:none;width:auto;margin:0}
.set-grp{margin-bottom:18px}
.set-grp>h3{font-size:13px;font-weight:600;color:var(--ink-2);margin:0 8px 7px}
.set-list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.set-row{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 14px;min-height:58px;text-align:right;color:var(--ink);font:inherit;position:relative}
.set-row+.set-row::before{content:"";position:absolute;top:0;right:62px;left:0;border-top:1px solid var(--line)}
.set-row>svg{color:var(--ink-2);opacity:.6;flex:none}
.set-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:none;background:var(--seal-soft)}
.set-t{flex:1;min-width:0;font-weight:600;font-size:16px}
.set-v{color:var(--ink-2);font-size:14px;white-space:nowrap}
.set-v.warn{color:var(--amber);font-weight:600}
.set-row-static{cursor:default}
.set-seg{flex:none;margin:0;min-width:0}
.set-row .set-seg{grid-auto-columns:auto;display:grid;grid-auto-flow:column;grid-template-columns:none}
.set-row .set-seg button{padding:6px 12px;font-size:13.5px;white-space:nowrap}
.set-danger{display:block;margin:4px auto 6px;background:none;border:0;color:var(--rose);font-weight:600;font-size:15px;font-family:inherit;padding:12px 18px;border-radius:12px}
.set-sheet p{margin:0;color:var(--ink-2);font-size:14.5px}
.set-sheet .btn{width:100%;margin-top:12px;font-size:16px;min-height:50px}
.set-sheet .btn-ghost#sCancel{margin-top:10px}
.set-sheet .last-bk{margin-top:12px}
.pname{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pname .rem-f input{text-align:right;font-weight:500}
.pf-note{display:flex;gap:6px;align-items:center;margin:14px 0 0;color:var(--ink-2);font-size:13.5px}
.pf-note .lic{color:var(--seal);flex:none}
.pq{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.pq-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pq-h b{font-size:15.5px}
.pq-why{background:none;border:0;color:var(--seal);font:600 13px var(--font);padding:4px 0;white-space:nowrap}
.pq-ex{margin:6px 0 0;color:var(--ink-2);font-size:13.5px;line-height:1.45}
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pchips button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 14.5px var(--font);min-height:40px;transition:background .15s,border-color .15s}
.pchips button[aria-checked=true]{background:var(--seal);border-color:var(--seal);color:var(--on-seal,#fff)}
.kids{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:14.5px}
.kids[hidden]{display:none}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:700 18px var(--font)}
.stepper b{min-width:16px;text-align:center;font-size:17px}
.set-sheet .pq{background:var(--paper);border-color:transparent}
.set-sheet .pchips button:not([aria-checked=true]){background:var(--surface)}
.greet{display:flex;flex-direction:column;gap:2px;margin:0 4px 12px}
.greet b{font-size:20px;letter-spacing:-.3px}
.greet span{display:flex;align-items:center;gap:5px;color:var(--ink-2);font-size:13.5px}
.greet span .lic{color:var(--seal)}
.greet-card{width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:18px;background:var(--seal-soft);color:var(--ink);padding:12px 14px;margin-bottom:12px;text-align:right;font:inherit;position:relative}
.gc-ic{width:38px;height:38px;border-radius:12px;background:var(--seal);color:var(--on-seal,#fff);display:grid;place-items:center;flex:none}
.gc-t{flex:1;min-width:0}.gc-t b{display:block;font-size:15px;color:var(--seal)}.gc-t small{display:block;color:var(--ink-2);font-size:13px}
.gc-x{font-style:normal;font-size:22px;color:var(--ink-2);padding:0 6px;line-height:1}
.wn-list{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:14px}
.wn-list li{display:flex;gap:12px;align-items:flex-start}
.wn-list b{display:block;font-size:15.5px}
.wn-list span:not(.wn-ic){display:block;color:var(--ink-2);font-size:14px;line-height:1.45;margin-top:1px}
.wn-ic{width:38px;height:38px;border-radius:12px;background:var(--seal-soft);color:var(--seal);display:grid;place-items:center;flex:none}
.inc-var{margin-top:16px}
.bonus-ill{width:130px;margin:-4px auto 4px}
.rem-card{background:var(--paper);border-radius:18px;padding:14px;margin-top:14px}
.rem-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rem-h b{display:block;font-size:16px}
.rem-h small{display:block;color:var(--ink-2);font-size:13px}
.rem-ic{width:38px;height:38px;border-radius:12px;background:var(--seal-soft);color:var(--seal);display:grid;place-items:center;flex:none}
.rem-card .lbl{margin-top:4px}
.day-chips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.day-chips button,.md-grid button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-height:42px;font:600 15px var(--font);padding:0;transition:background .15s,border-color .15s}
.md-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.md-grid button{min-height:38px;font-size:14px;border-radius:10px}
.day-chips button[aria-checked=true],.md-grid button[aria-checked=true]{background:var(--seal);border-color:var(--seal);color:var(--on-seal,#fff)}
.rem-f-wide{margin-top:4px}
.rem-f-wide span{font-size:13.5px}
.rem-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rem-f{display:flex;flex-direction:column;gap:4px;min-width:0}
.rem-f span{font-size:13px;color:var(--ink-2)}
.rem-f input{width:100%;min-width:0;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:600 16px var(--font);padding:0 10px;text-align:center;-webkit-appearance:none;appearance:none}
.rem-f input:focus{outline:none;border-color:var(--seal);box-shadow:0 0 0 3px var(--seal-soft)}
.rem-next{display:flex;align-items:flex-start;gap:8px;margin-top:12px;background:var(--seal-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45}
.rem-next .lic{color:var(--seal);flex:none;margin-top:2px}
.rem-next b{color:var(--seal)}
.set-sheet .rem-card .btn{margin-top:12px}
.rem-alt{display:block;width:100%;margin-top:8px;background:none;border:0;color:var(--seal);font:600 14px var(--font);padding:8px;text-decoration:underline;text-underline-offset:3px}
.rem-done{display:flex;gap:8px;align-items:flex-start;margin-top:10px;background:var(--ok-soft,#E3F4EC);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.rem-done .lic{color:var(--ok);flex:none;margin-top:2px}
.rem-done[hidden]{display:none}
.set-reset-btn{background:var(--rose-soft);color:var(--rose)}
.last-bk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--seal-soft);color:var(--seal)}
.last-bk.warn{background:var(--amber-soft);color:var(--amber)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--track);border-radius:12px;padding:3px;margin-top:12px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 0;font-size:15px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.steps{margin:12px 0 0;padding:0 20px 0 0;font-size:14px;color:var(--ink)}
.steps li{margin-bottom:6px}
.linkrow{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:12px 0 2px;color:var(--seal);font-weight:500;font-size:15px}
.danger h2{color:var(--rose)}
.danger .btn{background:var(--rose-soft);color:var(--rose)}
.ver{text-align:center;color:var(--ink-2);font-size:12px;margin:8px 0 4px}


/* Bottom sheet */
.backdrop{position:absolute;inset:0;background:rgba(10,20,18,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:24px 24px 0 0;z-index:21;
  padding:8px 20px max(18px, env(safe-area-inset-bottom, 0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  max-height:92%;overflow-y:auto}
.sheet.open{transform:none}
.handle{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:600;text-align:center}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:6px}
.amount:focus-within{border-color:var(--seal)}
.amount input{border:0;background:none;font-size:40px;font-weight:700;width:100%;max-width:220px;text-align:center;padding:0;outline:none}
.amount span{font-size:26px;color:var(--ink-2)}
.err{min-height:20px;font-size:13px;color:var(--rose);text-align:center}
.lbl{font-size:13px;color:var(--ink-2);margin:12px 0 8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 14px;font-size:15px;min-height:40px}
.chip[aria-checked="true"]{background:var(--seal);border-color:var(--seal);color:var(--on-seal)}
.field{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px}
.field:focus{border-color:var(--seal);outline:none}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:600;min-height:52px}
.btn-primary{background:var(--seal);color:var(--on-seal)}
.btn-danger{background:var(--rose-soft);color:var(--rose);flex:.6}
.btn-ghost{background:var(--track);color:var(--ink);flex:.6}

/* Toast */
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.has-undo.show{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:6px 8px 6px 18px}
.toast button{border:0;background:none;color:var(--seal-soft);font-weight:600;font-size:14px;padding:6px 8px}
:root[data-theme="dark"] .toast button{color:var(--seal)}

/* Onboarding */
.ob{flex:1;overflow-y:auto;padding:12px 22px 24px;display:flex;flex-direction:column}
.ob-steps{display:flex;gap:6px;margin:6px 0 30px}
.ob-steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.ob-steps i.on{background:var(--seal)}
.ob-kicker{color:var(--kraft-ink);font-weight:500;font-size:14px;margin-bottom:6px}
.ob h1{font-size:28px;line-height:1.2;margin:0 0 10px;font-weight:700;letter-spacing:-.3px}
.ob p.lead{color:var(--ink-2);margin:0 0 28px;max-width:34ch}
.ob .amount input{font-size:44px;max-width:260px}
.ob-note{margin-top:14px;text-align:center;font-size:15px;color:var(--ink-2);min-height:24px}
.ob-note b{color:var(--ink)}
.ob-env{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ob-env label{flex:1;display:flex;align-items:center;gap:10px;min-height:44px}
.ob-env input[type=checkbox]{width:22px;height:22px;accent-color:var(--seal);flex:none}
.ob-env .field{width:110px;text-align:center;flex:none}
.ob-env .field:disabled{opacity:.4}
.ob-fx{gap:6px}
.ob-fx label{min-width:0}
.ob-fx label span{overflow:hidden;text-overflow:ellipsis}
.ob-fx .field[data-act=budget]{width:96px}
.ob-fx .field[data-act=name]{flex:1;min-width:0;width:auto;text-align:start}
.ob-ic{border:0;background:none;color:var(--ink-3, var(--ink-2));width:34px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:20px;line-height:1}
.ob-ic:active{background:var(--track)}
.ob-sug{margin-top:14px}
.ob-sug > span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.ob-chips{display:flex;flex-wrap:wrap;gap:8px}
.ob-chips button{border:1px dashed var(--line);background:none;color:var(--seal);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:500}
.ob-add{display:flex;gap:8px;margin-top:14px}
.ob-add button{border:1px solid var(--seal);color:var(--seal);background:none;border-radius:12px;padding:0 16px;min-height:46px;font-weight:500;flex:none}
.ob-sum{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
.ob-sum b{color:var(--ink)}
.ob-foot{margin-top:auto;padding-top:24px;display:flex;gap:10px}

/* Desktop preview: phone frame */
@media (min-width: 640px){
  body{display:grid;place-items:center;background:var(--track);padding:24px}
  .app{width:440px;height:min(900px, 100%);border-radius:28px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(30,42,40,.12)}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

/* ===================== Redesign: calm indigo ===================== */
:root{
  --paper:#F4F5F9; --surface:#FFFFFF; --ink:#14162B; --ink-2:#5B5F78; --line:#E8EAF1;
  --seal:#4A55C9; --seal-soft:#ECEEFC; --on-seal:#FFFFFF;
  --kraft:#ECEEFC; --kraft-ink:#4A55C9;
  --ok:#1F8A5B; --ok-soft:#E4F4EC;
  --amber:#B5701A; --amber-soft:#FBF0DD;
  --rose:#C83E50; --rose-soft:#FCE8EB;
  --spent:#A9B0F0; --track:#EDEEF4; --fixed-bar:#9AA1C9;
  --hero-a:#4450C2; --hero-b:#6F79E2;
  --shadow:0 1px 2px rgba(20,22,43,.04), 0 6px 20px rgba(20,22,43,.05);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Hebrew", "Segoe UI", Roboto, "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1020; --surface:#171A2E; --ink:#ECEEF8; --ink-2:#A3A8C3; --line:#262A42;
    --seal:#8B94F4; --seal-soft:#23285A; --on-seal:#0E1020;
    --kraft:#23285A; --kraft-ink:#8B94F4;
    --ok:#4CC38A; --ok-soft:#133326;
    --amber:#E8B054; --amber-soft:#3A2C12;
    --rose:#F07A8A; --rose-soft:#3D1A21;
    --spent:#5A63B8; --track:#22253A; --fixed-bar:#59608F;
    --hero-a:#3A44A8; --hero-b:#5560C9;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1020; --surface:#171A2E; --ink:#ECEEF8; --ink-2:#A3A8C3; --line:#262A42;
  --seal:#8B94F4; --seal-soft:#23285A; --on-seal:#0E1020;
  --kraft:#23285A; --kraft-ink:#8B94F4;
  --ok:#4CC38A; --ok-soft:#133326;
  --amber:#E8B054; --amber-soft:#3A2C12;
  --rose:#F07A8A; --rose-soft:#3D1A21;
  --spent:#5A63B8; --track:#22253A; --fixed-bar:#59608F;
  --hero-a:#3A44A8; --hero-b:#5560C9;
  --shadow:none;
}
body{font-size:16px;letter-spacing:-.1px}
.top{padding:14px 20px 10px}
.brand{font-size:22px;font-weight:700;letter-spacing:-.4px}
.month{border:0;background:var(--surface);box-shadow:var(--shadow);padding:2px}
.month span{font-size:15px;font-weight:600}
main{padding:4px 16px 32px}

/* surfaces: no borders, soft depth */
.card,.list,.saverow,.set-card,.hero,.yr{border:0 !important;box-shadow:var(--shadow);border-radius:20px}
.list{border-radius:18px}
.card{padding:18px}
.env,.exp,.addline,.more,.catrow{border-color:var(--line)}
.env{padding:14px 16px}
.env-status{background:none !important;padding:0;font-size:13px;font-weight:600;color:var(--ok)}
.env-status.warn{color:var(--amber)} .env-status.over{color:var(--rose)} .env-status.none{color:var(--ink-2);font-weight:500}
.bar{height:5px;background:var(--track)}
.bar i{background:var(--ok)}
.line-nums,.env-meta,.exp-main small,.hint,.sec-sub,.tab-total span{font-size:13px}
.sec-head h2,.card-head h2{font-size:17px;font-weight:700;letter-spacing:-.2px}
.verdict{background:var(--ok-soft);color:var(--ok)}
.verdict.over{background:var(--rose-soft);color:var(--rose)}

/* tab bar: flat */
.tabs{border-top:0;box-shadow:0 -1px 0 var(--line);background:color-mix(in srgb, var(--surface) 92%, transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);align-items:center}
.tab{font-size:12px}
.tab svg{width:23px;height:23px}
.fab{width:50px;height:50px;border-radius:16px;margin-top:0;box-shadow:0 6px 16px rgba(74,85,201,.35)}
.fab svg{width:24px;height:24px}

/* seg control */
.seg{background:var(--track);border-radius:12px;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.seg button[aria-pressed="true"]{box-shadow:0 1px 3px rgba(20,22,43,.1)}

/* nudges */
.nudge{background:var(--amber-soft);border-radius:16px}
.nudge-brand{background:var(--seal-soft)} .nudge-brand .go{color:var(--seal)}
.install{background:var(--seal-soft)}

/* ---------- home: hero ---------- */
.hero2{margin-top:6px;border-radius:24px;padding:20px 20px 18px;color:#fff;
  background:linear-gradient(135deg, var(--hero-a), var(--hero-b));box-shadow:0 10px 30px rgba(68,80,194,.28)}
.hero2.over{background:linear-gradient(135deg, #B8344A, #DE6475);box-shadow:0 10px 30px rgba(184,52,74,.25)}
.h2-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h2-label{font-size:15px;opacity:.9}
.h2-save{display:flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:6px 11px;background:rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:600}
.h2-save svg{width:16px;height:16px}
.h2-num{font-size:44px;font-weight:700;letter-spacing:-1.2px;line-height:1.1;margin:10px 0 4px}
.h2-sub{font-size:14px;opacity:.88}
.h2-bar{display:flex;height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin:18px 0 10px;gap:3px}
.h2-bar i{display:block;height:100%}
.h2-bar i.sv{background:#6EE7B7}
.h2-bar i.rm{flex:1;background:#fff}
.h2-bar i.sp{background:#FF8A8A}
.hero2.over .h2-bar i.sp,.hero2.over .h2-legend i.sp{background:#FFE0E4}
.h2-legend{display:flex;gap:16px;font-size:13px;opacity:.9}
.h2-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;background:rgba(255,255,255,.22);vertical-align:0}
.h2-legend i.sv{background:#6EE7B7} .h2-legend i.sp{background:#FF8A8A} .h2-legend i.rm{background:#fff}

/* ---------- home: cards ---------- */
.card-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.card-head h2{margin:0}
.card-head span{font-size:13px;color:var(--ink-2)}
.spend,.wf{margin-top:14px}
.ill{display:block;width:100%;height:auto;margin:0 auto}
.ill .bg{fill:var(--seal-soft)}
.ill .dot{fill:var(--seal);opacity:.25}
.ill .a{fill:var(--seal)}
.ill .b{fill:#8C95F0}
.ill .w{fill:var(--surface)}
.ill .st{stroke:var(--seal);stroke-width:3}
.ill .soft{fill:var(--seal-soft)}
.ill .g{fill:#ECBE55}
.ill .gd{fill:#C9952F}
.ill .gs{fill:none;stroke:#C9952F;stroke-width:2.5}
.ill .ok{fill:var(--ok)}
.ill .okd{fill:none;stroke:var(--surface);stroke-width:3;opacity:.7}
.ill .s{fill:none;stroke:var(--seal);stroke-width:5;stroke-linecap:round}
.ill .ws{fill:none;stroke:var(--surface);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.ill .sok{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.ill .sg{fill:none;stroke:#C9952F;stroke-width:4;stroke-linecap:round}
.ob-ill{width:150px;margin:0 0 8px}
.em-ill{width:150px;margin:2px auto 6px}

.sc{margin-top:14px}
.sc-svg{width:100%;height:auto;display:block;margin-top:6px}
.sc-base{stroke:var(--line);stroke-width:1}
.sc-bar.ok{fill:var(--seal)}
.sc-bar.met{fill:var(--ok)}
.sc-bar.proj{fill:var(--seal-soft);stroke:var(--seal);stroke-width:1.2;stroke-dasharray:3 2}
.sc-goal{stroke:var(--amber);stroke-width:2;stroke-linecap:round}
.sc-m{font:500 9.5px var(--font);fill:var(--ink-2)}
.sc-m.now{fill:var(--seal);font-weight:700}
.sc-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-top:8px}
.sc-legend span{display:inline-flex;align-items:center;gap:6px}
.sc-legend i{width:12px;height:10px;border-radius:3px;display:inline-block}
.sc-legend i.ok{background:var(--seal)} .sc-legend i.met{background:var(--ok)}
.sc-legend i.proj{background:var(--seal-soft);border:1.2px dashed var(--seal)}
.sc-legend i.goal{height:3px;border-radius:2px;background:var(--amber)}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:none}}
@keyframes colGrow{from{transform:scaleY(0)}to{transform:none}}
@keyframes donutIn{from{opacity:0;transform:rotate(-70deg) scale(.9)}to{opacity:1;transform:none}}
main.anim .bar i,main.anim .cbar i,main.anim .ts-bar i{transform-origin:100% 50%;animation:barGrow .7s cubic-bezier(.2,.8,.2,1) both}
main.anim .sc-bar{transform-box:fill-box;transform-origin:50% 100%;animation:colGrow .6s cubic-bezier(.2,.8,.2,1) both}
main.anim .sp-donut{animation:donutIn .7s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){ main.anim .bar i,main.anim .cbar i,main.anim .ts-bar i,main.anim .sc-bar,main.anim .sp-donut{animation:none} }

.sp-row{display:flex;align-items:center;gap:16px;margin-top:8px}
.sp-donut{width:132px;height:132px;flex:none}
.sp-num{font:700 15px var(--font);fill:var(--ink)}
.sp-lbl{font:400 10px var(--font);fill:var(--ink-2)}
.sp-side{flex:1;min-width:0}
.sp-sub{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.sp-sub b{font-weight:600}
.sp-legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.sp-legend li{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink)}
.sp-legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-legend b{font-weight:700;white-space:nowrap}
.sp-legend .sp-none{color:var(--ink-2);font-size:13.5px}
.sp-dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.sp-fixed{margin-top:14px;border-top:1px solid var(--line)}
.sp-fixed summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 0 6px;cursor:pointer;font-size:15px}
.sp-fixed summary::-webkit-details-marker{display:none}
.sp-fixed summary span{flex:1}
.sp-fixed summary b{font-weight:600}
.sp-fixed summary svg{color:var(--ink-2);transition:transform .2s;flex:none}
.sp-fixed[open] summary svg{transform:rotate(-90deg)}
.sp-fixed ul{list-style:none;margin:4px 0 2px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.sp-fixed li{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);min-width:0}
.sp-fixed li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-fixed li b{font-weight:700;color:var(--ink);white-space:nowrap}
.sp-fixed b.est,.sp-fixed li b.est{color:var(--ink-2)}
.wf-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.wf-tile{background:var(--paper);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.wf-tile span{font-size:12.5px;color:var(--ink-2)}
.wf-tile b{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-tile b.est{color:var(--ink-2)}
.wf-tile small{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-tile.in b{color:var(--ok)}
.wf-tile.sv b{color:var(--seal)}
@media (prefers-reduced-motion: reduce){ .sp-fixed summary svg{transition:none} }

.sb-group{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-2);margin:14px 0 6px}
.sb-group:first-of-type{margin-top:2px}
.sb-group b{font-weight:600}
.sb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.sb-top{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:6px}
.sb-top span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-top b{font-weight:600;white-space:nowrap}
.sb-top b.est,.wf-val b.est{color:var(--ink-2)}
.sb-track{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.sb-track i{display:block;height:100%;border-radius:99px}
.spend .hint{margin:14px 0 0}

.wf-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wf-row:first-of-type{border-top:0}
.wf-label{font-size:15px;color:var(--ink-2)}
.wf-val{text-align:left;display:flex;flex-direction:column;align-items:flex-end}
.wf-val b{font-size:16px;font-weight:600}
.wf-val small{font-size:12px;color:var(--ink-2);margin-top:1px}
.wf-total{border-top:1.5px solid var(--ink) !important;margin-top:2px;padding-top:12px}
.wf-total .wf-label{color:var(--ink);font-weight:700;font-size:16px}
.wf-total .wf-val b{font-size:20px;font-weight:700;color:var(--seal)}
.wf-total .wf-val b.neg{color:var(--rose)}
.wf-note{margin:12px 0 0;font-size:14px;padding:10px 12px;border-radius:12px}
.wf-note.ok{background:var(--ok-soft);color:var(--ok)}
.wf-note.over{background:var(--rose-soft);color:var(--rose)}

.rows{margin-top:14px}
.row-link{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:14px 16px;text-align:right;border-bottom:1px solid var(--line)}
.row-link:last-child{border-bottom:0}
.row-link:active{background:var(--track)}
.rl-ic{width:36px;height:36px;border-radius:11px;background:var(--seal-soft);color:var(--seal);display:grid;place-items:center;flex:none}
.rl-ic svg{width:20px;height:20px}
.rl-main{flex:1;min-width:0;font-weight:500}
.rl-main small{display:block;font-size:13px;color:var(--ink-2);font-weight:400}
.row-link b{font-weight:600;white-space:nowrap}
.row-link > svg{color:var(--ink-2);flex:none}

/* ---------- expenses page: modern rows ---------- */
.tsum{margin-top:2px}
.ts-top{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.ts-num{font-size:30px;font-weight:700;letter-spacing:-.8px;margin:4px 0 10px;display:flex;align-items:baseline;gap:8px}
.ts-num small{font-size:14px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.ts-bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.ts-bar i{display:block;height:100%;border-radius:99px;background:var(--seal)}
.ts-bar i.over{background:var(--rose)}
.ts-foot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;font-weight:600}
.st-ok{color:var(--ok)} .st-warn{color:var(--amber)} .st-over{color:var(--rose)} .st-none{color:var(--ink-2);font-weight:500}
.sec-head{margin:22px 4px 10px}
.link-btn{display:flex;align-items:center;gap:4px;border:0;background:none;color:var(--seal);font-weight:600;font-size:15px;padding:4px}
.link-btn svg{width:16px;height:16px}
.cico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--seal-soft);color:var(--seal)}
.cico .lic{width:21px;height:21px}
.chip .lic{width:16px;height:16px;vertical-align:-3px}
.set-ic{color:var(--seal)}
.tr-ri{color:var(--seal)}
.tr-ri.do{color:var(--ok)}
.tr-note .lic,.lbl .lic{vertical-align:-3px;color:var(--seal)}
.set-alert>span:first-child{display:grid}
.set-ic .lic{width:19px;height:19px}
.hp-ic .lic,.an-ic .lic{width:19px;height:19px}
.wl-points .wp-ic .lic{display:block}
.sm-line .lic{width:16px;height:16px;vertical-align:-3px;margin-left:4px;color:var(--seal)}
#sheetTitle .lic{width:20px;height:20px;vertical-align:-4px;color:var(--seal)}
.cmain{flex:1;min-width:0;display:flex;flex-direction:column}
.cmain b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmain small{font-size:13px;margin-top:1px;display:block}
.cmain small:not([class*="st-"]){color:var(--ink-2)}
.cmain .sep{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--ink-2);margin:0 7px;opacity:.6}
.camt{display:flex;flex-direction:column;align-items:flex-end;text-align:left;white-space:nowrap}
.camt b{font-weight:700;font-size:15px}
.camt b.est{color:var(--ink-2);font-weight:600}
.camt small{font-size:12px;color:var(--ink-2)}
.crow{width:100%;display:grid;grid-template-columns:40px 1fr auto;column-gap:12px;row-gap:10px;align-items:center;border:0;background:none;padding:14px 16px;text-align:right;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow:active,.erow:active,.fmain:active{background:var(--track)}
.cbar{grid-column:2 / 4;height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:-2px}
.cbar i{display:block;height:100%;border-radius:99px}
.erow{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 16px;text-align:right;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.dgroup{display:flex;justify-content:space-between;align-items:baseline;margin:16px 6px 8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.dgroup b{color:var(--ink);font-weight:600}
.frow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.frow:last-of-type{border-bottom:1px solid var(--line)}
.fmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:13px 4px 13px 16px;text-align:right}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;margin-right:14px;display:grid;place-items:center;color:#fff;padding:0}
.chk:not(.off):active{transform:scale(.92)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on svg{width:14px;height:14px}
.chk.off{border-style:dashed;opacity:.5}
.frow.is-paid .cmain b{color:var(--ink-2)}
.chip span{font-size:15px}
.h2-label small{display:block;font-size:12px;opacity:.8;margin-top:1px}

/* ---------- savings page ---------- */
.yr{background:linear-gradient(135deg, var(--hero-a), var(--hero-b)) !important;color:#fff;box-shadow:0 10px 30px rgba(68,80,194,.28) !important;text-align:right}
.yr .yr-label,.yr .yr-of{color:rgba(255,255,255,.85)}
.yr .yr-num{color:#fff}
.yr .bar{background:rgba(255,255,255,.22)}
.yr .bar i{background:#fff}
.yr .sl{color:rgba(255,255,255,.85)}
.yr .sl i{border-color:rgba(255,255,255,.35);color:var(--hero-a)}
.yr .sl.met i{background:#fff;border-color:#fff}
.yr .sl.miss i{background:rgba(255,120,140,.35);border-color:rgba(255,190,200,.9);color:#fff}
.yr .sl.pend i{border-color:#FFD58A}
.yr .sl.prog i{background:rgba(255,255,255,.35);border-color:#fff}
.yr .sl.now span{color:#fff}
.yr .yr-msg{background:rgba(255,255,255,.14);color:#fff}

/* ---------- details (list) tab ---------- */
.go-list{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;border:0;border-radius:16px;
  background:var(--surface);box-shadow:var(--shadow);padding:15px 16px;color:var(--seal);font-weight:600;font-size:15px;text-align:right}
.go-list svg{flex:none}
.lsearch{position:relative;margin-top:2px}
.lsearch svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-2);pointer-events:none}
.lsearch input{width:100%;border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:13px 42px 13px 14px;font-size:16px;color:var(--ink);outline:none}
.lsearch input:focus{box-shadow:0 0 0 2px var(--seal)}
.lsearch input::-webkit-search-cancel-button{-webkit-appearance:none}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:0;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);padding:8px 14px;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--seal);color:var(--on-seal)}
.lsort{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 0;font-size:13px;color:var(--ink-2)}
.lsort div{display:flex;background:var(--track);border-radius:10px;padding:2px}
.lsort button{border:0;background:none;border-radius:8px;padding:6px 11px;font-size:13px;color:var(--ink-2)}
.lsort button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(20,22,43,.1)}
.lsum{display:flex;justify-content:space-between;align-items:baseline;margin:14px 4px 0;font-size:14px;color:var(--ink-2)}
.lsum b{font-size:18px;color:var(--ink);font-weight:700}
.lsum span{display:inline-flex;align-items:center;gap:6px}
.sec-q{margin-top:16px}
#listBody > .list:first-of-type{margin-top:10px}
#listBody > .lsum + .list{margin-top:10px}

/* ---------- PIN lock ---------- */
.pin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px max(24px, env(safe-area-inset-bottom, 0px));position:relative;text-align:center}
.pin-cancel{position:absolute;top:10px;left:16px;border:0;background:none;color:var(--seal);font-size:16px;font-weight:600;padding:8px}
.pin-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg, var(--hero-a), var(--hero-b));box-shadow:0 8px 22px rgba(68,80,194,.3);margin-bottom:18px}
.pin-ic svg{width:30px;height:30px}
.pin-ic.warn{background:linear-gradient(135deg, #B8344A, #DE6475);box-shadow:0 8px 22px rgba(184,52,74,.25)}
.pin h1{font-size:24px;margin:0 0 6px;letter-spacing:-.3px}
.pin-sub{color:var(--ink-2);margin:0;min-height:24px;font-size:15px}
.pin-dots{display:flex;gap:18px;margin:26px 0 8px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-2);transition:all .12s}
.pin-dots i.on{background:var(--seal);border-color:var(--seal);transform:scale(1.1)}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pin-err{color:var(--rose);font-size:14px;min-height:22px;margin:0 0 10px}
.pin-pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 26px;direction:ltr}
.pin-pad button{width:76px;height:76px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:30px;font-weight:500;color:var(--ink);display:grid;place-items:center}
.pin-pad button:active{background:var(--seal-soft);transform:scale(.96)}
.pin-pad button[data-k="del"]{background:none;box-shadow:none;color:var(--ink-2)}
.pin-pad button[data-k="del"] svg{width:28px;height:28px}
.pin-pad.off{opacity:.4}
.pin-link{border:0;background:none;color:var(--seal);font-size:15px;font-weight:600;margin-top:22px;padding:8px}
.pin-wide{width:100%;max-width:320px;margin-top:24px;flex:none}
@media (max-height:640px){ .pin-pad{grid-template-columns:repeat(3,64px);gap:10px 22px} .pin-pad button{width:64px;height:64px;font-size:26px} .pin-dots{margin:16px 0 6px} }

/* ---------- month summary ---------- */
.back-btn{display:flex;align-items:center;gap:2px;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:99px;padding:7px 12px 7px 14px;color:var(--seal);font-weight:600;font-size:15px}
.back-btn svg{width:18px;height:18px}
.sm-hero{margin-top:6px;border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg, var(--hero-a), var(--hero-b));box-shadow:0 10px 30px rgba(68,80,194,.28)}
.sm-hero.over{background:linear-gradient(135deg, #B8344A, #DE6475);box-shadow:0 10px 30px rgba(184,52,74,.25)}
.sm-hero .h2-label small{display:block;font-size:12px;opacity:.8}
.sm-title{font-size:28px;font-weight:700;letter-spacing:-.6px;margin:8px 0 14px;line-height:1.2}
.sm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
.sm-grid span{display:block;font-size:12px;opacity:.85}
.sm-grid b{font-size:16px;font-weight:700}
.sm-card{margin-top:14px}
.sm-save{display:flex;gap:10px}
.sm-save .field{flex:1}
.sm-save .btn{flex:none;min-height:46px;padding:10px 18px;font-size:16px}
.sm-saved{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sm-saved b{font-size:22px;font-weight:700}
.sm-saved span{font-size:14px;color:var(--ink-2);flex:1}
.list.flat{box-shadow:none;border:1px solid var(--line);border-radius:14px}
.list.flat .erow{padding:11px 12px}
.sm-cmp{margin:12px 0 0;font-size:14px}
.sm-line{display:flex;justify-content:space-between;gap:10px;margin:0 0 8px;font-size:15px}
.sg{padding:12px 0;border-top:1px solid var(--line)}
.sg:first-of-type{border-top:0;padding-top:0}
.sg p{margin:0;font-size:15px}
.sg-act{display:flex;gap:8px;margin-top:10px}
.sg-act .btn{font-size:14px;min-height:42px;padding:9px 12px;flex:1}
.sg-act .btn-ghost{flex:.7}
.sm-done{width:100%;margin-top:16px}
/* category average + history chart */
.cavg{grid-column:2 / 4;font-size:12px;color:var(--ink-2);margin-top:-4px}
.hc{background:var(--paper);border-radius:14px;padding:10px 12px 4px;margin:0 0 14px}
.hc-head{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.hc-leg i{display:inline-block;width:14px;border-top:2px dashed var(--ink);vertical-align:3px;margin-left:5px}
.hc svg{width:100%;height:auto;display:block;direction:ltr}
.hc-v{font:600 10px var(--font);fill:var(--ink)}
.hc-m{font:400 10px var(--font);fill:var(--ink-2)}

/* quick saving options */
.qs{display:flex;flex-direction:column;gap:8px;margin:0 0 10px}
.qs-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:15px;color:var(--ink);text-align:right}
.qs-btn b{font-weight:700;color:var(--seal)}
.qs-btn:active,.qs-btn.on{border-color:var(--seal);background:var(--seal-soft)}
.sm-bd{margin:8px 0 0;font-size:14px;color:var(--ink-2)}

.an-btn{width:100%;display:flex;align-items:center;gap:12px;margin-top:14px;border:0;border-radius:14px;background:var(--seal-soft);color:var(--ink);padding:13px 14px;text-align:right}
.an-btn:active{filter:brightness(.97)}
.an-ic{width:36px;height:36px;border-radius:11px;background:var(--seal);color:var(--on-seal);display:grid;place-items:center;flex:none}
.an-ic svg{width:20px;height:20px}
.an-t{flex:1;min-width:0}
.an-t b{display:block;font-size:15px;color:var(--seal)}
.an-t small{display:block;font-size:13px;color:var(--ink-2)}
.an-btn > svg{color:var(--seal);flex:none}

/* debts & goals */
.lc{width:100%;height:auto;display:block;direction:ltr}
.sm-od{display:flex;align-items:center;gap:10px}
.sm-od span{flex:1;font-weight:500}
.sm-od .field{width:120px;flex:none;text-align:center}
.sm-od .btn{flex:none;min-height:46px;padding:10px 14px;font-size:15px}
.empty-month .em-ic{font-size:26px}

/* help */
.hp{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
.hp summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:600;font-size:16px;cursor:pointer}
.hp summary::-webkit-details-marker{display:none}
.hp-ic{width:38px;height:38px;border-radius:12px;background:var(--seal-soft);display:grid;place-items:center;font-size:19px;flex:none}
.hp summary span:nth-child(2){flex:1}
.hp summary i{width:10px;height:10px;border-left:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(-45deg);transition:transform .2s;margin-left:4px}
.hp[open] summary i{transform:rotate(135deg)}
.hp-b{padding:0 16px 16px;font-size:15px;color:var(--ink)}
.hp-b p{margin:0}
.hp-ol{margin:0;padding-right:20px}
.hp-ol li{margin-bottom:6px}
.hp-dl{margin:0}
.hp-dl dt{font-weight:600;margin-top:12px}
.hp-dl dt:first-child{margin-top:0}
.hp-dl dd{margin:2px 0 0;color:var(--ink-2)}
.an-ic{font-weight:700;font-size:17px}

/* narrow phones (iPhone SE / mini) */
.brand{white-space:nowrap}
.app-brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:36px;height:36px;border-radius:10px;flex:none;box-shadow:0 2px 6px rgba(40,48,140,.22)}
.h2-save span{white-space:nowrap}
@media (max-width:360px){
  .top{padding:12px 14px 8px;gap:8px}
  .brand{font-size:18px}
  .brand-logo{width:30px;height:30px;border-radius:8px}
  .app-brand{gap:8px}
  .month span{min-width:80px;font-size:14px}
  .month button{width:30px;height:30px}

function svgIcon(n, size){ return `<svg class="lic" viewBox="0 0 24 24" width="${size || 20}" height="${size || 20}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${LUCIDE[n] || LUCIDE.tag}</svg>`; }
const ICON_MAP = [

  [/תקשורת|מנוי|טלפון|אינטרנט|סלולר/,"smartphone"],[/ביטוח/,"shield-check"],[/לימוד|קורס|שכר לימוד/,"graduation-cap"],[/כושר|ספורט/,"dumbbell"],
  [/טיפול|תיקון|אגרה/,"wrench"],[/מתנ|אירוע|חתונ/,"gift"],[/בלתי צפוי|חירום/,"triangle-alert"],[/ילד|גן|חוג/,"baby"],[/בריאות|רופא|תרופ/,"stethoscope"],
  [/חיה|כלב|חתול|וטרינר/,"paw-print"],[/משכורת|הכנסה|עבודה/,"briefcase"],[/נסיע|תחבורה|אוטובוס|רכבת/,"bus"]
];
function iconFor(name){ for(const [re, ic] of ICON_MAP) if(re.test(name || "")) return svgIcon(ic); return svgIcon("tag"); }
function daysIn(ym){ const [y,m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function num(v){ const n = parseFloat(String(v).replace(/,/g,"").trim()); return isFinite(n) ? n : 0; }
function fmt(n){
  const r = Math.round(Math.abs(n)*100)/100;
  return r.toLocaleString("he-IL", { maximumFractionDigits: r % 1 ? 2 : 0 });
}
function money(n){ return "<bdi>" + fmt(n) + "&nbsp;₪</bdi>"; }
function smoney(n){ return "<bdi>" + (n < 0 ? "−" : "") + fmt(n) + "&nbsp;₪</bdi>"; }
function dateLabel(iso){ const [y,m,d] = iso.split("-").map(Number); return d + " ב" + MONTHS[m-1]; }
function catById(id){ return state.cats.find(c => c.id === id) || { name:"ללא קטגוריה", color:"#888" }; }

function mkLine(name, plan){ return { id:uid(), name, plan:plan||0, actual:null, note:"" }; }
function cloneLines(lines){
  const out = {};
  const doneIds = new Set((state && state.debts || []).filter(d => d.done).map(d => d.id));
  ["income","fixed","extra"].forEach(k => out[k] = (lines[k] || []).filter(l => !(l.debtId && doneIds.has(l.debtId))).map(l => Object.assign({ id:uid(), name:l.name, plan:l.plan, actual:null, note:l.note || "", day:l.day || null }, l.debtId ? { debtId:l.debtId } : {})));
  return out;
}
function defaultLines(income){
  return { income:[mkLine("משכורת", income)], fixed:DEFAULT_FIXED.concat(DEFAULT_EXTRA).map(n => mkLine(n,0)), extra:[] };
}
function migrate(){
  if(!state || !state.onboarded) return;
  (state.cats || []).forEach(c => { const i = PREV_COLORS.indexOf((c.color || "").toUpperCase()); if(i >= 0) c.color = COLORS[i]; });
  if(!state.template.lines){ state.template.lines = defaultLines(state.template.income || 0); }
  if(!state.createdAt) state.createdAt = Date.now();
  if(!Array.isArray(state.expenses)) state.expenses = [];
  // itemized expenses: convert any monthly totals (envAct) into single named entries
  Object.keys(state.months).forEach(k => {
    const m = state.months[k];
    if(m.envAct){
      Object.keys(m.envAct).forEach(id => {
        const v = m.envAct[id];
        if(v != null && v > 0) state.expenses.push({ id:uid(), date:k + "-" + pad(cycleDay()), catId:id, amount:v, name:"סכום שהוזן לפני הפירוט", created:Date.now() });
      });
      delete m.envAct;
    }
  });
  state.expenses.forEach(e => { if(!e.name) e.name = e.note || catById(e.catId).name; });
  if(!state.cleanedBrowse){
    const cur = curYM();
    Object.keys(state.months).forEach(k => { const m = state.months[k]; m._ym = k; const has = monthHasData(m); delete m._ym; if(k < cur && m.lines && !has) delete state.months[k]; });
    state.cleanedBrowse = true;
  }
  if(!state.theme) state.theme = "auto";
  state.cats.forEach(c => { const i = OLD_COLORS.indexOf(c.color); if(i >= 0) c.color = COLORS[i]; });
  const mergeExtra = L => { if(L && L.extra && L.extra.length){ L.fixed = (L.fixed || []).concat(L.extra); L.extra = []; } };
  Object.keys(state.months).forEach(k => {
    const m = state.months[k];
    if(!m.lines){ m.lines = cloneLines(state.template.lines); m.lines.income[0].plan = m.income || 0; delete m.income; }
    mergeExtra(m.lines);
  });
  mergeExtra(state.template.lines);
  save();
}
function sourceKeyFor(ym){
  const keys = Object.keys(state.months).sort();
  return keys.filter(k => k < ym).pop() || keys.find(k => k > ym) || null;
}
function monthHasData(m){
  if(!m) return false;
  if(m.savedActual != null) return true;
  if(m._ym && state.expenses.some(e => cycleOf(e.date) === m._ym)) return true;
  return ["income","fixed","extra"].some(k => (m.lines[k] || []).some(l => l.actual != null));
}
function openMonth(ym, empty){
  const m = monthData(ym);
  if(empty){
    ["income","fixed","extra"].forEach(k => m.lines[k].forEach(l => l.plan = 0));
    Object.keys(m.env).forEach(id => m.env[id] = 0);
  }
  save();
}
function monthData(ym){
  if(!state.months[ym]){
    const srcKey = sourceKeyFor(ym);
    const src = srcKey ? state.months[srcKey] : state.template;
    state.months[ym] = { saving: src.saving, env: Object.assign({}, src.env), lines: cloneLines(src.lines) };
    save();
  }
  return state.months[ym];
}
function activeCats(){ return state.cats.filter(c => !c.archived); }
function calc(ym){
  const m = monthData(ym);
  const exps = monthExpenses(ym);
  const byCat = {};
  exps.forEach(e => byCat[e.catId] = (byCat[e.catId] || 0) + e.amount);
  const variable = Object.values(byCat).reduce((a,v) => a + v, 0);
  const sum = (k, f) => m.lines[k].reduce((a,l) => a + f(l), 0);
  const plan = k => sum(k, l => l.plan || 0);
  const act = k => sum(k, l => l.actual == null ? 0 : l.actual);
  const eff = k => sum(k, l => l.actual == null ? (l.plan || 0) : l.actual);
  const envPlan = Object.keys(m.env).reduce((a,id) => { const c = state.cats.find(x => x.id === id); return a + ((c && !c.archived) || byCat[id] > 0 ? (m.env[id] || 0) : 0); }, 0);
  const r = {
    m, exps, byCat, variable, saving:m.saving,
    incomePlan:plan("income"), incomeAct:act("income"), incomeEff:eff("income"),
    fixedPlan:plan("fixed"), fixedAct:act("fixed"), fixedEff:eff("fixed"),
    extraPlan:plan("extra"), extraAct:act("extra"), extraEff:eff("extra"),
    envPlan
  };
  r.expensesEff = r.fixedEff + r.extraEff + variable;
  const ended = ym < curYM() || !!m.closed;
  const goal = m.saving || 0, saved = m.savedActual;
  const hasAny = exps.length > 0 || ["income","fixed","extra"].some(k => m.lines[k].some(l => l.actual != null));
  r.autoSaved = hasAny && isTracked(ym) ? Math.max(0, r.incomeEff - r.expensesEff) : null;
  r.savedManual = saved != null; r.monthEnded = ended;
  r.savedActual = saved != null ? saved : (ended ? r.autoSaved : null);
  r.savingEff = saved != null ? (ended ? saved : Math.max(goal, saved)) : (ended && r.autoSaved != null ? r.autoSaved : goal);
  r.leftAfterGoal = r.incomeEff - goal - r.expensesEff;
  r.avail = r.incomeEff - r.savingEff - r.expensesEff;
  r.planLeft = r.incomePlan - r.fixedPlan - r.extraPlan - r.envPlan;
  r.actLeft = r.incomeAct - r.fixedAct - r.extraAct - variable;
  return r;
}
function envStatus(budget, used){
  const ratio = budget > 0 ? used / budget : (used > 0 ? 2 : 0);
  let cls = "", text;
  if(budget <= 0){ cls = "none"; text = used > 0 ? `${money(used)} ללא תקציב` : "ללא תקציב"; }
  else if(ratio > 1){ cls = "over"; text = `חריגה של ${money(used - budget)}`; }
  else if(ratio >= .8){ cls = "warn"; text = `קרוב לגבול, נשארו ${money(budget - used)}`; }
  else text = `נשארו ${money(budget - used)}`;
  return { cls, text, ratio };
}
function monthExpenses(ym){
  return state.expenses.filter(e => cycleOf(e.date) === ym)
    .sort((a,b) => b.date.localeCompare(a.date) || b.created - a.created);
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo){
  let t = app.querySelector(".toast");
  if(!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); app.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">ביטול</button>' : ""}`;
  t.classList.toggle("has-undo", !!undo);
  if(undo) t.querySelector("button").onclick = () => { clearTimeout(toastTimer); t.classList.remove("show"); undo(); };
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), undo ? 5000 : 1900);
}

function bindObRestore(){
  const orb = document.getElementById("obRestore"), orf = document.getElementById("obRestoreFile");
  if(!orb) return;
  orb.onclick = () => { ui.noLockUntil = Date.now() + 120000; orf.click(); };
  orf.onchange = () => {
    const file = orf.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let o; try{ o = JSON.parse(reader.result); }catch(e){ o = null; }
      if(!validBackup(o)){ toast("הקובץ הזה אינו גיבוי של האפליקציה"); return; }
      if(o.exportedAt) o.lastBackup = Date.parse(o.exportedAt) || o.lastBackup;
      delete o.exportedAt; delete o.app; delete o.lock;
      if(!Array.isArray(o.expenses)) o.expenses = [];
      state = o; ob = null; migrate(); save(); ui.tab = "home"; ui.month = curYM(); ui.locked = false; render(); toast("הנתונים שוחזרו");
    };
    reader.readAsText(file);
  };
}

      <div class="c-bal" id="cBal" aria-labelledby="cT">
        <div class="c-step"><span>${i + 1} מתוך ${n}</span><button id="cSkip">דלג על ההסבר</button></div>
        <h4 id="cT">${s.t}</h4>
        <div class="c-lines">
          <div><b>מה זה</b><span>${s.what}</span></div>
          <div><b>למה חשוב</b><span>${s.why}</span></div>
          <div><b>מה עושים</b><span>${s.act}</span></div>
        </div>
        <div class="c-act">
          ${i > 0 ? `<button class="btn btn-ghost" id="cPrev">הקודם</button>` : ""}
          <button class="btn btn-primary" id="cNext">${last ? "סיום" : "הבא"}</button>
          <span class="c-dots" aria-hidden="true">${coach.steps.map((_, j) => `<i class="${j === i ? "on" : ""}"></i>`).join("")}</span>
        </div>
      </div>`;
    const bal = ov.querySelector("#cBal"), H = ar.height, bh = bal.offsetHeight, below = H - (hole.y + hole.h), above = hole.y;
    let top, cls;
    if(below >= bh + 18 || below >= above){ top = Math.min(hole.y + hole.h + 12, H - bh - 8); cls = "below"; }
    else { top = Math.max(8, hole.y - bh - 12); cls = "above"; }
    bal.style.top = top + "px"; bal.classList.add(cls);
    const cx = hole.x + hole.w / 2, bl = bal.offsetLeft, bw = bal.offsetWidth;
    bal.style.setProperty("--ax", Math.max(18, Math.min(bw - 34, cx - bl - 8)) + "px");
    const coversHole = cls === "below" ? top < hole.y + hole.h : top + bh > hole.y;
    if(coversHole) bal.classList.add("noarrow");
    ov.querySelector("#cNext").onclick = () => { if(last) endCoach(); else { coach.i++; drawCoach(); } };
    const pv = ov.querySelector("#cPrev"); if(pv) pv.onclick = () => { coach.i--; drawCoach(); };
    ov.querySelector("#cSkip").onclick = endCoach;
    ov.querySelector("#cNext").focus({ preventScroll:true });
  });
}

/* ================= PIN LOCK ================= */
function lockOn(){ return !!(state && state.lock && state.lock.enabled); }
async function hashPin(pin, salt){
  const txt = salt + ":" + pin;
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  let h = 2166136261; for(let i = 0; i < txt.length; i++){ h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); }
  return "f" + (h >>> 0).toString(16);
}

let pinCtx = null, lockTimer = null;

function drawPin(err){
  const c = pinCtx; if(!c) return;
  clearTimeout(lockTimer);
  const waitMs = c.mode === "verify" ? Math.max(0, ((state.lock && state.lock.until) || 0) - Date.now()) : 0;

      <div class="pin-dots ${err ? "shake" : ""}" aria-label="הוקלדו ${c.entry.length} מתוך 4 ספרות">${[0,1,2,3].map(i => `<i class="${i < c.entry.length ? "on" : ""}"></i>`).join("")}</div>
      <p class="pin-err" role="alert">${err || ""}</p>

      </div>
      ${c.forgot ? `<button class="pin-link" id="pinForgot">שכחתי את הקוד</button>` : ""}
    </div>`;
  if(waiting) lockTimer = setTimeout(() => drawPin(), 1000);
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => pinKey(b.dataset.k));
  const pc = document.getElementById("pinCancel"); if(pc) pc.onclick = () => { pinCtx = null; renderApp(); };
  const pf = document.getElementById("pinForgot"); if(pf) pf.onclick = drawForgot;
}
function pinKey(k){
  const c = pinCtx; if(!c || c.busy) return;
  if(k === "del"){ c.entry = c.entry.slice(0, -1); drawPin(); return; }
  if(c.entry.length >= 4) return;
  c.entry += k; drawPin();
  if(c.entry.length === 4){
    c.busy = true;
    setTimeout(async () => {
      const res = await c.onComplete(c.entry);
      if(pinCtx !== c) return;
      c.busy = false;
      if(res === true) return;
      c.entry = ""; drawPin(res || "קוד שגוי");
    }, 140);
  }
}
async function checkPin(pin){
  const L = state.lock;
  if((L.until || 0) > Date.now()) return false;
  const ok = (await hashPin(pin, L.salt)) === L.hash;
  if(ok){ L.failed = 0; L.until = 0; save(); return true; }
  L.failed = (L.failed || 0) + 1;
  if(L.failed >= 5) L.until = Date.now() + Math.min(600000, 30000 * Math.pow(2, L.failed - 5));
  save(); return false;
}

  pinScreen({ mode:"verify", title:"הזינו קוד", sub:"ניהול פיננסי נעול", forgot:true, onComplete: async pin => {

    const L = state.lock;
    return (L.until || 0) > Date.now() ? "" : (L.failed >= 3 ? `קוד שגוי. נשארו ${5 - L.failed} ניסיונות לפני המתנה.` : "קוד שגוי");
  }});
}

function applyProfile(){

  if(p.household === "family") base.push("גן, צהרון וחוגים");
  if(p.incomeType === "self") base.push("הפרשה למס וביטוח לאומי");
  const autoNames = new Set(DEFAULT_FIXED.concat(["רכב ודלק"],["שכירות","משכנתא","גן, צהרון וחוגים","הפרשה למס וביטוח לאומי"]));
  const custom = (ob.fixed || []).filter(f => !autoNames.has(f.name));
  ob.fixed = base.map(n => {
    if(keep[n]) return keep[n];
    if((n === "שכירות" || n === "משכנתא") && keep["שכירות / משכנתא"]) return Object.assign({}, keep["שכירות / משכנתא"], { name:n });
    return { id:uid(), name:n, on:false, budget:"" };
  }).concat(custom);
  const hasFuel = ob.cats.some(c => c.name === "דלק");
  if(p.car !== "no" && !hasFuel) ob.cats.splice(Math.max(0, ob.cats.length - 1), 0, { id:uid(), name:"דלק", on:false, budget:"", color:COLORS[ob.cats.length % COLORS.length], auto:true });
  if(p.car === "no" && hasFuel) ob.cats = ob.cats.filter(c => !(c.name === "דלק" && c.auto && !num(c.budget)));
  const hasKidsCat = ob.cats.some(c => c.name === "ילדים");
  if(p.household === "family" && !hasKidsCat) ob.cats.splice(Math.max(0, ob.cats.length - 1), 0, { id:uid(), name:"ילדים", on:false, budget:"", color:COLORS[ob.cats.length % COLORS.length], auto:true });
  if(p.household !== "family" && hasKidsCat) ob.cats = ob.cats.filter(c => !(c.name === "ילדים" && c.auto && !num(c.budget)));
  if(p.incomeType === "hourly" || p.incomeType === "self") ob.incomeVar = true;
  if((p.focus === "overdraft" || p.focus === "loans") && ob.hasDebts == null){

}
