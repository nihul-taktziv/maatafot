<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4450C2"/>
      <stop offset="1" stop-color="#727CE4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE6A6"/>
      <stop offset="1" stop-color="#D9A93F"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E0B24A"/>
      <stop offset="1" stop-color="#FCE8AC"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1B2170" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- soft decorative ring like the app's hero -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="34"/>
  <g id="mark" filter="url(#sh)">
    <!-- open ring (left/bottom), gap top-right where the arrow exits -->
    <path d="M 690 300 A 282 282 0 1 0 794 512" fill="none" stroke="url(#goldH)" stroke-width="30" stroke-linecap="round"/>
    <!-- bars -->
    <rect x="352" y="520" width="78" height="170" rx="14" fill="url(#gold)"/>
    <rect x="456" y="440" width="78" height="250" rx="14" fill="url(#gold)"/>
    <rect x="560" y="350" width="78" height="340" rx="14" fill="url(#gold)"/>
    <!-- rising arrow -->
    <path d="M 300 470 C 420 440 560 380 690 262" fill="none" stroke="url(#goldH)" stroke-width="30" stroke-linecap="round"/>
    <path d="M 610 250 L 724 230 L 700 344 Z" fill="#FCE8AC" stroke="#FCE8AC" stroke-width="14" stroke-linejoin="round"/>
    <!-- shekel coin -->
    <circle cx="676" cy="652" r="104" fill="url(#gold)"/>
    <circle cx="676" cy="652" r="104" fill="none" stroke="#4A54C6" stroke-width="12"/>
    <circle cx="676" cy="652" r="80" fill="none" stroke="#B8862A" stroke-opacity=".55" stroke-width="5"/>
    <!-- ₪ glyph drawn as paths -->
    <g fill="none" stroke="#3A44A8" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 628 702 L 628 604 L 676 604 Q 700 604 700 628 L 700 668"/>
      <path d="M 724 602 L 724 700 L 676 700 Q 652 700 652 676 L 652 636"/>
    </g>
  </g>
</svg>
